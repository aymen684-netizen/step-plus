name: English+ production security guards

on:
  push:
    branches:
      - feature/english-ai-studio
      - test/production-safeguards-20261024
    paths:
      - 'backend/worker.js'
      - 'tests/production-guards.test.mjs'
      - '.github/workflows/production-guards.yml'
  pull_request:
    paths:
      - 'backend/worker.js'
      - 'tests/production-guards.test.mjs'
      - '.github/workflows/production-guards.yml'

permissions:
  contents: read

jobs:
  production-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Syntax check
        run: node --check backend/worker.js
      - name: Verify production API is disabled by default (no network)
        run: node --test tests/production-guards.test.mjs
