<!doctype html><html lang="ar" dir="rtl"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ستيب بلس | تجميعات الأسبوع</title><style>*{box-sizing:border-box}body{font:16px Tahoma,Arial;background:#eff7fb;color:#193848;margin:0}main{max-width:760px;margin:auto;padding:18px}header{background:#104454;color:white;border-radius:20px;padding:24px}h1{margin:0 0 12px}section{background:white;border-radius:16px;padding:22px;margin-top:15px;box-shadow:0 8px 25px #102c4412}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:13px;background:#dceefa;color:#164155;font-weight:bold;margin:4px}button.primary{background:#0eac9d;color:white}button.choice{display:block;width:100%;direction:ltr;text-align:left;background:#f3f7fa;padding:16px;margin:8px 0}button.correct{background:#c8f3dc}button.wrong{background:#ffd5d5}a{color:#baf9e4}#quiz,#end{display:none}.en{direction:ltr;text-align:left;line-height:1.8}small{opacity:.85}</style><main><header><h1>🔥 تجميعات الأسبوع — STEP+</h1><p>مراجعة القراءة والقواعد مع التصحيح الفوري. هذه دفعة أولى مختارة من الملفات المرفقة، وليست جميع أسئلتها بعد.</p><a href="./">العودة إلى التطبيق الأساسي</a></header><section id="menu"><h2>ماذا تريد أن تراجع؟</h2><p id="count"></p><button onclick="start('قواعد')" class="primary">قواعد مشروحة</button><button onclick="start('قراءة')" class="primary">قراءة عالية التكرار</button><button onclick="start('الكل')">اختبار مختلط</button><button onclick="reset()">إعادة الأسئلة</button><p><small>يحفظ الأسئلة التي ظهرت على هذا المتصفح لتجنب تكرارها.</small></p></section><section id="quiz"><p id="progress"></p><h2 id="kind"></h2><p id="question" class="en"></p><div id="choices"></div><p id="explanation"></p><button id="next" class="primary" onclick="advance()" style="display:none">السؤال التالي ←</button><button onclick="home()">رجوع</button></section><section id="end"><h2>أحسنت! 🎉</h2><p id="score"></p><button onclick="home()" class="primary">المزيد من التدريب</button></section></main><script>const q=[["قواعد","In no way _____ to lend money to anyone.",["I agree","agree","do agree I","do I agree"],3,"بعد In no way نستخدم قلب الفاعل والفعل المساعد: do I agree."],["قواعد","The students designed their project very _____.",["creativity","creatively","creative","creativeness"],1,"نحتاج ظرفًا لوصف الفعل designed."],["قواعد","Eric and Susan _____ for a walk when it suddenly started raining.",["would have","were about to","were going","would be to"],1,"were about to تعني كانا على وشك."],["قواعد","Things could have been easier if we _____ enough money.",["are giving","were given","have been given","had been given"],3,"في الشرط الافتراضي للماضي نستخدم if + past perfect."],["قواعد","I've always enjoyed _____ about history.",["to reading","read","to read","reading"],3,"بعد enjoy نستخدم gerund أي الفعل مع ing."],["قواعد","If the storm _____, they would have been able to travel.",["ends","had ended","will end","ended"],1,"Third conditional: if + had + V3."],["قواعد","Do your shopping at the local market. It's much _____ than supermarkets.",["cheap","cheaper","cheapest","cheaply"],1,"than علامة واضحة على صيغة المقارنة cheaper."],["قراءة | The Spanish Flu","During World War I, crowded battlefields helped the 1918 influenza spread worldwide. Some experts believe it began in Europe, while another theory places its origins in the United States. Which statement is a theory rather than a confirmed numerical fact?",["It began in the United States.","It killed at least 50 million.","It affected millions of people.","It spread during World War I."],0,"المنشأ عُرض في القطعة بوصفه نظرية.",5],["قراءة | The Spanish Flu","World War I battlefields became large centers of infection. What can be inferred?",["The war stopped the infection.","The war increased transmission.","The virus started in Antarctica.","The disease was harmless."],1,"القتال والتجمعات أسهما في انتشار العدوى.",5],["قراءة | California Strawberries","Organic strawberry production rose fivefold between 2000 and 2012. Which years?",["1960–2014","2005–2015","2010–2012","2000–2012"],3,"المعلومة مذكورة حرفيًا.",5],["قراءة | California Strawberries","Which of the following are soil-borne pathogens that damage strawberries?",["Verticillium dahliae and Macrophomina phaseolina","methyl bromide and methyl iodide","methyl iodide and Macrophomina phaseolina","Verticillium dahliae and methyl bromide"],0,"الفطريات المذكورة ممرضات، أما methyl bromide فهو مادة تبخير.",5],["قراءة | Engineering Innovation","Rome had 269 miles of aqueducts underground and 46 miles above ground. How long was the full system?",["269 miles","46 miles","315 miles","112 miles"],2,"269 + 46 = 315.",4],["قراءة | Engineering Innovation","Who developed rain-harvesting techniques on Crete in the third millennium BCE?",["Minoans","Romans","Greeks","Egyptians"],0,"المينويون ذُكروا مباشرة في النص.",4],["قراءة | Nanotechnology","Which forces allow geckos to climb upside down on glass?",["Van der Waals forces","Sticking forces","Gravity","Friction alone"],0,"النص يذكر Van der Waals forces.",4],["قراءة | Nanotechnology","Approximately how many hairs are on the bottom of each gecko toe?",["15","Hundreds","Two thousand","Two million"],3,"نحو مليوني شعيرة في كل إصبع.",4],["قراءة | Mercantilism","Which theory argued that a country should export more than it imports?",["Mercantilism","Absolute advantage","Both","Neither"],0,"الهدف في المدرسة التجارية هو الفائض التجاري.",4],["قراءة | Automation","A study considered 46 countries representing 80% of the global workforce. What can be inferred?",["It was a large study.","It was fully automated.","It studied one factory.","All countries were included."],0,"حجم العينة يدل على نطاق واسع.",4],["قراءة | Stress","In a fight-or-flight situation, which systems become less active?",["Respiratory and nervous","Skeletal and muscular","Digestive and immune","Circulatory and sensory"],2,"وظائف الهضم والمناعة تتباطأ.",4]];const K='step-plus-weekly-used-2026';let pool=[],pos=0,points=0,answered=false;const seen=()=>{try{return JSON.parse(localStorage.getItem(K)||'[]')}catch{return []}};function update(){document.getElementById('count').textContent='المتبقي: '+q.filter((x,i)=>!seen().includes(i)).length+' من '+q.length+' سؤالًا'}function start(type){pool=q.map((x,i)=>({x,i})).filter(z=>(type==='الكل'||z.x[0].startsWith(type))&&!seen().includes(z.i));if(!pool.length){alert('انتهت الأسئلة الجديدة. اختر قسمًا آخر أو أعد الأسئلة.');return}pool.sort(()=>Math.random()-.5);pos=points=0;document.getElementById('menu').style.display='none';document.getElementById('end').style.display='none';document.getElementById('quiz').style.display='block';show()}function show(){const t=pool[pos],x=t.x;answered=false;localStorage.setItem(K,JSON.stringify([...new Set([...seen(),t.i])]));document.getElementById('progress').textContent='السؤال '+(pos+1)+' من '+pool.length;document.getElementById('kind').textContent=x[0];document.getElementById('question').textContent=x[1];document.getElementById('choices').innerHTML='';document.getElementById('explanation').textContent='';document.getElementById('next').style.display='none';x[2].forEach((choice,i)=>{const b=document.createElement('button');b.className='choice';b.textContent='ABCD'[i]+') '+choice;b.onclick=()=>answer(i);document.getElementById('choices').appendChild(b)});update()}function answer(i){if(answered)return;answered=true;let x=pool[pos].x;if(i===x[3])points++;document.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===x[3])b.classList.add('correct');else if(j===i)b.classList.add('wrong')});document.getElementById('explanation').textContent='✅ الإجابة '+('ABCD'[x[3]])+' — '+x[4];document.getElementById('next').style.display='inline-block'}function advance(){pos++;if(pos<pool.length)show();else{document.getElementById('quiz').style.display='none';document.getElementById('end').style.display='block';document.getElementById('score').textContent='درجتك: '+points+' من '+pool.length}}function home(){document.getElementById('menu').style.display='block';document.getElementById('quiz').style.display='none';document.getElementById('end').style.display='none';update()}function reset(){if(confirm('هل تريد إعادة الأسئلة؟')){localStorage.removeItem(K);update()}}update();</script></html>
