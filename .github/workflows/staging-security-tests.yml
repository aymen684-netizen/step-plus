name: English+ staging security tests
on:
  push:
    branches: [chore/english-plus-audit-2026-10-23]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run isolated staging unit tests
        run: node --test tests/worker-staging.test.mjs
