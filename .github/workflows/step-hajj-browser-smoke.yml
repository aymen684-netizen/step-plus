name: English+ STEP Hajj quarantine browser smoke
on:
  push:
    branches: [qa/step-hajj-quarantine-20261026]
    paths:
      - 'academy.html'
      - 'tests/browser/step-hajj.spec.mjs'
      - 'tests/step-hajj-playwright.config.mjs'
      - '.github/workflows/step-hajj-browser-smoke.yml'
  pull_request:
    paths:
      - 'academy.html'
      - 'tests/browser/step-hajj.spec.mjs'
      - 'tests/step-hajj-playwright.config.mjs'
      - '.github/workflows/step-hajj-browser-smoke.yml'
permissions:
  contents: read
jobs:
  browser-quarantine:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate tests and installed Chrome
        run: |
          command -v google-chrome
          google-chrome --version
          node --check tests/browser/step-hajj.spec.mjs
          node --check tests/step-hajj-playwright.config.mjs
      - name: Install pinned local-only Playwright runner
        run: npm install --no-save @playwright/test@1.64.1
      - name: Exercise safe reading, mock, Hajj passage and old mistakes in localhost
        run: npx playwright test -c tests/step-hajj-playwright.config.mjs
