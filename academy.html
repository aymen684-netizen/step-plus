<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0f4155"><title>أكاديمية STEP+ | تعلّم وتدرّب واختبر</title><style>:root{font-family:Tahoma,Arial;color:#183748;background:#f3f8fa}*{box-sizing:border-box}body{margin:0}main{max-width:1020px;margin:auto;padding:18px 14px 90px}header{padding:22px;background:linear-gradient(120deg,#123a55,#15776e);color:white;border-radius:24px}header h1{margin:5px 0;font-size:27px}.small{font-size:13px;opacity:.85}.nav{display:flex;gap:8px;overflow-x:auto;padding:16px 0}.nav button{white-space:nowrap}.btn,.nav button{border:0;border-radius:13px;padding:12px 15px;font:700 14px Tahoma,Arial;background:#e1eef4;color:#154058;cursor:pointer}.btn.active,.btn.primary{background:#0c978a;color:white}.card{padding:20px;background:white;border-radius:18px;margin:12px 0;box-shadow:0 6px 20px #123a5210}.muted{color:#597385;font-size:14px;line-height:1.8}.pill{display:inline-block;border-radius:50px;padding:5px 10px;background:#fef3c7;color:#804900;font-size:12px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:12px}h2{margin:5px 0 14px}h3{margin:8px 0}.passage{white-space:pre-line;direction:ltr;text-align:left;line-height:1.85;background:#f0f6fa;padding:18px;border-radius:15px;max-height:320px;overflow:auto;font-size:15px}.question{direction:ltr;text-align:left;font-weight:700;line-height:1.8}.choice{display:block;width:100%;border:2px solid transparent;border-radius:12px;background:#edf3f7;padding:14px;text-align:left;direction:ltr;margin:7px 0;font:15px Arial;cursor:pointer}.choice.correct{background:#d4f8e6;border-color:#16a34a}.choice.wrong{background:#ffdbdb;border-color:#ef4444}.info{padding:14px;background:#e8f8f0;border-radius:13px;line-height:1.9}.hidden{display:none!important}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.metric{background:#e5f4f4;padding:15px;border-radius:13px}.metric b{font-size:22px}.chart{direction:ltr;display:flex;align-items:flex-end;justify-content:space-around;gap:10px;height:210px;border-bottom:2px solid #cbd5e1;padding:8px 0 0}.barwrap{height:100%;display:flex;flex-direction:column;justify-content:end;align-items:center;flex:1;font-size:10px;text-align:center}.bar{width:58%;background:#36a3cb;min-height:3px}.bar2{background:#f59e0b}.barlabel{padding:5px 0;height:36px}a{color:inherit}progress{width:100%;height:12px}#toast{font-size:13px}button:disabled{opacity:.8;cursor:default}@media(max-width:500px){header h1{font-size:22px}.card{padding:15px}.passage{font-size:14px}}</style><main><header><div class="small">STEP+ ACADEMY • تجربة التعلم الجديدة</div><h1>🎓 تعلّم ← تدرّب ← اختبر</h1><p>خطة منهجية للقواعد والقراءة، مع قطع ★5 الخمس وأسئلة تدريبية ومحاكاة مصغرة ودفتر للأخطاء.</p><div class="toolbar"><a class="btn" href="./">الرئيسية القديمة</a><a class="btn" href="./weekly.html">التجميعات الأسبوعية</a></div></header><nav class="nav" id="tabs"><button onclick="page('home')" class="active">🏠 خطتي</button><button onclick="page('lessons')">📘 الشروحات</button><button onclick="page('reading')">⭐ قطع ★5</button><button onclick="page('practice')">✍️ التدريب</button><button onclick="page('mock')">⏱️ محاكاة</button><button onclick="page('mistakes')">🔁 أخطائي</button></nav><div id="view"></div></main><script>const P=[{"id":"hajj","title":"A Graph Regarding Hajj Pilgrims","ar":"رسم بياني عن الحجاج","star":5,"pages":"3","kind":"chart","body":"Number of Hajj Pilgrims, 2004–2014. The chart separates pilgrims from inside and outside Saudi Arabia. The highest total appears in 2012. The largest outside-Saudi segment among the listed answer years appears in 2010.","chart":{"labels":["2004","2006","2008","2010","2012","2014"],"inside":[1.52,1.67,1.76,1.83,1.75,1.42],"outside":[0.62,0.67,0.65,0.91,1.42,0.65]},"summary":true},{"id":"inflation","title":"Controlling Inflation","ar":"السيطرة على التضخم","star":5,"pages":"4–6","body":"Passage A: Inflation can occur when an economy expands because of increased spending, causing prices to rise and purchasing power to fall. A contractionary monetary policy reduces money supply through higher interest rates and changes to bonds. Higher reserve requirements make banks hold more money and lend less. Fiscal policy also raises taxes or cuts public spending, which reduces aggregate demand. If an economy is already shrinking, such measures can worsen unemployment.\n\nPassage B: Governments can address demand-pull inflation through monetary and fiscal measures. Reducing the quantity of money in circulation and bank lending can lower demand. Governments may also reduce expenditure and transfers or raise taxes to decrease total spending. Both texts describe reducing demand as an important way to control inflation.","summary":true},{"id":"flu","title":"The Spanish Flu","ar":"الإنفلونزا الإسبانية","star":5,"pages":"7–8","body":"From 1918 to 1920, the virus known as the Spanish Flu infected 500 million people worldwide and killed between 50 and 100 million. It reached almost every continent. World War I battlefields offered conditions that helped infection spread. Some experts believe the virus began in Europe, whereas a widely accepted theory suggests it began in the United States and later traveled to France. Air travel today could allow similar infections to travel vast distances far more quickly.","summary":true},{"id":"travel","title":"Survey on Why People Travel","ar":"رسم بياني عن أسباب السفر","star":5,"pages":"9","kind":"chart","body":"Survey on Why People Travel: visit friends or relatives 33%; leisure 30%; work-related 22.5%; personal business 14.6%.","chart":{"labels":["Visit friends / relatives","Leisure","Work-related","Personal business"],"values":[33,30,22.5,14.6]},"summary":false},{"id":"berries","title":"California Strawberries","ar":"الفراولة في كاليفورنيا","star":5,"pages":"10–12","body":"California grows a large share of America's fruits and vegetables, but strawberry farming involves high pesticide use, costs and environmental pressures. Strawberry production grew through improved plant breeding, coastal conditions and fumigation of soil. Two soil-borne plant pathogens are Verticillium dahliae and Macrophomina phaseolina. Restrictions on methyl bromide and other fumigants have created challenges. Organic strawberry production increased fivefold between 2000 and 2012. Growing affordable year-round strawberries without toxic chemicals remains difficult.","summary":true}];const Q=[["r1","reading","hajj","Which year had the most pilgrims in the chart?",["2002","2008","2010","2012"],3,"لاحظ العمود الأعلى في الرسم وهو 2012."],["r2","reading","hajj","Which year had the most pilgrims from outside Saudi Arabia among the options?",["2002","2008","2010","2012"],2,"بحسب مفتاح إجابات الملف لسؤال الحجاج من الخارج: 2010. انتبه للتمييز بين المجموع والحجاج من الخارج."],["r3","reading","inflation","What do both passages say about the consequences of inflation?",["It lowers all prices","Money is worth less and the economy can suffer","It always makes people wealthier","It removes unemployment"],1,"تقل القدرة الشرائية وقد تكون الآثار سلبية على الاقتصاد."],["r4","reading","inflation","What can governments do to reduce demand-pull inflation?",["Increase bank lending","Lower taxes and raise spending","Increase interest rates and reduce money in circulation","Print more money"],2,"السياسة الانكماشية ترفع الفائدة وتقلص المعروض النقدي."],["r5","reading","inflation","How do higher taxes help reduce inflation?",["They increase aggregate demand","They reduce demand in the economy","They guarantee higher wages","They cause all imports to stop"],1,"الضرائب تحد من الإنفاق وبالتالي تقلل الطلب الكلي."],["r6","reading","inflation","What helps keep aggregate demand from fueling excessive inflation?",["Demand always exceeding supply","Eliminating bank reserves","Maintaining a balance in aggregate demand","Never changing taxes"],2,"الموازنة في الطلب الكلي تخفف الضغط التضخمي."],["r7","reading","flu","Which claim about the origin of the Spanish Flu is presented as a theory?",["It may have started in the United States","It infected millions","It occurred between 1918 and 1920","It spread internationally"],0,"المنشأ غير محسوم؛ النص يقدمه بوصفه نظرية."],["r8","reading","flu","How did World War I affect the flu pandemic?",["It prevented travel","It helped spread the infection","It produced a vaccine","It stopped the outbreak"],1,"ميادين الحرب وفرت ظروفًا مواتية للانتشار."],["r9","reading","flu","What can be inferred about a similar virus spreading today?",["It would necessarily spread more slowly","Modern transport could spread it faster","It could not reach Asia","It would only spread at sea"],1,"النقل الجوي يسهل الانتقال لمسافات بعيدة بسرعة."],["r10","reading","travel","What percentage of people traveled for leisure?",["22.5%","30%","33%","14.6%"],1,"Leisure موضحة في الرسم بنسبة 30%."],["r11","reading","travel","What was the largest reason for travel shown in the survey?",["Personal business","Work-related","Leisure","Visit friends or relatives"],3,"أكبر عمود هو زيارة الأصدقاء أو الأقارب 33%."],["r12","reading","berries","Which pathogens damage strawberry plants?",["Verticillium dahliae and Macrophomina phaseolina","Methyl bromide and methyl iodide","Broccoli and cabbage","Carbon and oxygen"],0,"الأولان مسببا أمراض للتربة، بينما methyl bromide مادة تبخير."],["r13","reading","berries","Between which years did organic strawberry production increase fivefold?",["1960–2014","2000–2012","2005–2015","2010–2012"],1,"الزيادة خمسة أضعاف وردت للفترة 2000–2012."],["r14","reading","berries","What is a central challenge for California strawberry growers?",["Producing fruit with fewer toxic chemicals at affordable prices","Finding a cold climate","Growing strawberries without soil","Selling only overseas"],0,"الصعوبة في الجمع بين تقليل المواد السامة والإنتاج الواسع وتكلفة مناسبة."],["g1","grammar",null,"In no way _____ to lend money to anyone.",["I agree","agree I","do agree I","do I agree"],3,"أداة النفي في بداية الجملة تستدعي inversion: do + subject + base verb."],["g2","grammar",null,"The students designed their project very _____.",["creative","creatively","creativity","creativeness"],1,"designed فعل، ويحتاج ظرف كيفية creatively."],["g3","grammar",null,"I have always enjoyed _____ about history.",["read","to read","reading","to reading"],2,"enjoy بعدها gerund أي V-ing."],["g4","grammar",null,"If the storm _____, they would have been able to travel.",["ends","had ended","would end","has ended"],1,"الشرط الثالث: if + had + التصريف الثالث."],["g5","grammar",null,"Do your shopping at the local market. It is much _____ than the supermarket.",["cheap","cheaper","cheapest","cheaply"],1,"وجود than دليل للمقارنة comparative."],["g6","grammar",null,"By the time we arrived, the train _____.",["left","had left","leaves","has left"],1,"حدث سابق لحدث آخر في الماضي: past perfect."],["g7","grammar",null,"The report _____ last week by the committee.",["completed","has complete","was completed","completing"],2,"مبني للمجهول بالماضي: was + V3."],["g8","grammar",null,"Neither the teachers nor the principal _____ available today.",["are","were","be","is"],3,"يتوافق الفعل مع أقرب فاعل principal المفرد."],["g9","grammar",null,"She insisted on _____ the instructions carefully.",["follow","following","to follow","followed"],1,"بعد حرف الجر on يأتي V-ing."],["g10","grammar",null,"Had I known about the delay, I _____ earlier.",["would leave","will leave","would have left","left"],2,"حذف if في الشرط الثالث مع Had + subject + V3."],["g11","grammar",null,"The results were _____ surprising that everyone checked the figures again.",["such","so","too","very"],1,"so + adjective + that."],["g12","grammar",null,"Each of the students _____ a unique identification number.",["have","has","are having","were"],1,"Each مفرد نحويًا، لذا has."]];const L=[["تحديد الزمن من الدليل","yesterday / ago → Past Simple. Since / for مع الاستمرار → Present Perfect. By the time + حدث ماضٍ → غالبًا Past Perfect.","When I arrived, the meeting had started.","لا تعتمد على كلمة واحدة إذا اختلف معنى السياق."],["الشرطيات","Zero: if + present, present. First: if + present, will + V. Second: if + past, would + V. Third: if + had + V3, would have + V3.","If she had studied, she would have passed.","وجود would have غالبًا يرشح الشرط الثالث."],["المبني للمجهول","Be بصيغتها الزمنية + past participle. حدّد الزمن قبل اختيار was/were/has been.","The book was published in 2020.","احذف الخيارات التي لا تحتوي على be + V3 عند الحاجة للمجهول."],["قلب الجملة Inversion","بعد Never / Rarely / In no way في بداية الجملة يأتي الفعل المساعد قبل الفاعل.","Never have I seen such a result.","لا تقل Never I have."],["Gerund & Infinitive","بعد enjoy, avoid, mind و after prepositions نستخدم V-ing؛ وبعد decide, plan, want نستخدم to + V.","I enjoy reading. / I decided to study.","حدد الكلمة قبل الفراغ أولًا."],["Subject–verb agreement","Each, everybody, neither غالبًا مفرد. في either…or / neither…nor قد يُراعي الفعل أقرب فاعل.","Neither Ali nor his friends are here.","لا تنخدع بجمع بعيد عن الفاعل الحقيقي."],["Comparisons","Comparative + than؛ Superlative + the. Too + adjective + to V و so + adjective + that.","This test is harder than the last one.","وجود than يستبعد superlative."],["الروابط ومعانيها","Although / However → تعارض. Therefore / Thus / As a result → نتيجة. Moreover / Furthermore → إضافة.","It rained; therefore, we stayed home.","السؤال يختبر العلاقة المنطقية لا الترجمة الحرفية."],["مهارة قراءة: دليل لا تخمين","اقرأ السؤال، التقط الأسماء والأرقام، وابحث عن السطر الداعم. في inference اختر الأقرب للنص لا معلومة خارجية.","What can be inferred? → evidence + careful inference","انتبه لصيغ NOT وEXCEPT وتجنب الخيارات المطلقة always/never ما لم يثبتها النص."],["مهارة قراءة: الرسوم","حدّد عنوان الرسم، مفتاح الألوان، وحدة القياس والفئة المطلوبة قبل مقارنة الأعمدة.","Total pilgrims ≠ pilgrims from outside","لا تخلط بين الإجمالي وجزء من الأعمدة."]];const DIAG=["g1","g3","g4","g7","r3","r7","r10","r12"];const key='step-academy-v1';let state={seen:[],mistakes:[],results:[],diagnostic:false};try{state={...state,...JSON.parse(localStorage.getItem(key)||'{}')}}catch{}let sess=null,timer=null;function save(){localStorage.setItem(key,JSON.stringify(state))}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function btn(label,fn,cls=''){return '<button class="btn '+cls+'" onclick="'+fn+'">'+label+'</button>'}function page(id){if(timer){clearInterval(timer);timer=null}sess=null;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.getAttribute('onclick')==="page('"+id+"')"));const f={home,lessons,reading,practice,mock,mistakes};document.getElementById('view').innerHTML=f[id]();window.scrollTo({top:0,behavior:'smooth'})}const one=id=>Q.find(x=>x[0]===id);function home(){let done=state.seen.length;return '<div class="card"><h2>خطتك التعليمية</h2><p class="muted">ابدأ بتحديد المستوى المبدئي، ثم اقرأ الشرح، وحلّ التطبيق، وبعد التدريب جرّب المحاكاة. النتيجة تقديرية وليست درجة STEP رسمية.</p><div class="grid"><div class="metric"><b>'+done+' / '+Q.length+'</b><div>أسئلة تمت الإجابة عنها</div></div><div class="metric"><b>'+state.mistakes.length+'</b><div>أخطاء للمراجعة</div></div><div class="metric"><b>'+state.results.length+'</b><div>جلسات مكتملة</div></div></div></div><div class="grid"><div class="card"><h3>1 — تعرّف على مستواك</h3><p class="muted">8 أسئلة تشخيصية محفوظة منفصلة عن سجل التدريب.</p>'+btn(state.diagnostic?'إعادة التقييم':'ابدأ تحديد المستوى',"begin('diagnostic')",'primary')+'</div><div class="card"><h3>2 — تعلّم القواعد</h3><p class="muted">10 دروس مع مثال وفخ شائع وطريقة حل.</p>'+btn('عرض الدروس',"page('lessons')")+'</div><div class="card"><h3>3 — أتقن قطع ★5</h3><p class="muted">كل القطع الخمس ظاهرة في قسم واحد مع رسوم بيانية أو مقتطفات موضحة المصدر.</p>'+btn('عرض القطع الخمس',"page('reading')",'primary')+'</div><div class="card"><h3>4 — محاكاة الاختبار</h3><p class="muted">محاكاة مصغرة بمؤقت ونتيجة وتحليل للأخطاء.</p>'+btn('ابدأ المحاكاة',"page('mock')")+'</div></div>'}function lessons(){return '<div class="card"><h2>📘 الشروحات الجاهزة</h2><p class="muted">اقرأ القاعدة والمثال والفخ، ثم حلّ أسئلة القواعد.</p></div>'+L.map((x,i)=>'<details class="card" '+(i===0?'open':'')+'><summary><b>'+(i+1)+'. '+esc(x[0])+'</b></summary><p>'+esc(x[1])+'</p><div class="passage">'+esc(x[2])+'</div><p class="info"><b>فخ الامتحان:</b> '+esc(x[3])+'</p></details>').join('')+'<div class="card">'+btn('انتقل لتدريب القواعد',"begin('grammar')",'primary')+'</div>'}function chart(p){if(!p.chart)return '';if(p.id==='hajj'){return '<div class="chart">'+p.chart.labels.map((a,i)=>'<div class="barwrap"><div style="font-size:11px">'+(p.chart.inside[i]+p.chart.outside[i]).toFixed(2)+'M</div><div style="width:55%;height:'+((p.chart.inside[i]+p.chart.outside[i])/3.5*155)+'px;display:flex;flex-direction:column;justify-content:flex-end"><div class="bar2" style="height:'+(p.chart.outside[i]/(p.chart.inside[i]+p.chart.outside[i])*100)+'%"></div><div class="bar" style="width:100%;height:'+(p.chart.inside[i]/(p.chart.inside[i]+p.chart.outside[i])*100)+'%"></div></div><div class="barlabel">'+a+'</div></div>').join('')+'</div><p class="small">الأزرق: من داخل السعودية • البرتقالي: من خارجها. الأرقام مقربة لغرض التوضيح؛ راجع الرسم الأصلي في الملف.</p>'}return '<div class="chart">'+p.chart.labels.map((a,i)=>'<div class="barwrap"><b>'+p.chart.values[i]+'%</b><div class="bar" style="height:'+(p.chart.values[i]*4)+'px"></div><div class="barlabel">'+esc(a)+'</div></div>').join('')+'</div>'}function reading(){return '<div class="card"><h2>⭐ جميع القطع ذات ★5 (5 من 5)</h2><p class="muted">المصدر: فهرس القراءة الأسبوعية من 11 إلى 15 أكتوبر. المحتوى النصي المعروض هنا مقتطفات تعليمية مركزة وليس نسخًا كاملًا لكل قطعة؛ الرسوم مبسطة مع تمييز البيانات التقريبية.</p></div>'+P.map(p=>'<div class="card"><div class="toolbar"><h3>'+esc(p.title)+'</h3><span class="pill">★5</span></div><p class="muted">'+esc(p.ar)+' · الصفحات '+esc(p.pages)+' · '+(p.summary?'مقتطف مراجعة':'بيانات الرسم')+'</p>'+chart(p)+'<div class="passage">'+esc(p.body)+'</div><p>'+btn('اختبر نفسك في هذه القطعة',"begin('passage','"+p.id+"')",'primary')+'</p></div>').join('')}function practice(){return '<div class="card"><h2>✍️ تدريب غير مكرر</h2><p>كل سؤال يُسجل بعد إجابتك عليه، وليس عند فتحه. تُستبعد الأسئلة التي تدربت عليها من الجلسات التالية، وتبقى متاحة في مراجعة الأخطاء.</p><div class="toolbar">'+btn('تدريب القواعد',"begin('grammar')",'primary')+btn('تدريب القراءة',"begin('reading')",'primary')+btn('مختلط',"begin('mixed')")+'</div><p class="muted">المتبقي غير المستخدم: '+Q.filter(x=>!state.seen.includes(x[0])).length+' من '+Q.length+'</p><p>'+btn('إعادة بنك التدريب من البداية',"resetSeen()")+'</p></div>'}function mock(){return '<div class="card"><h2>⏱️ محاكاة STEP مصغرة</h2><p class="muted">محاكاة تدريبية مدتها 25 دقيقة، حتى 20 سؤالًا من القواعد والقراءة، ولا تشمل الاستماع ولا تعادل اختبار STEP الكامل. يمكنك اختيار استخدام أسئلة البنك التي لم تظهر سابقًا أو اختبار مراجعة يجمع كل الأسئلة.</p>'+btn('محاكاة بأسئلة غير مستخدمة',"begin('mock')",'primary')+btn('محاكاة مراجعة شاملة',"begin('review')")+'</div>'}function mistakes(){const arr=state.mistakes.map(one).filter(Boolean);return '<div class="card"><h2>🔁 دفتر الأخطاء</h2><p>هذه الأسئلة التي أجبت عنها خطأ. راجع سبب الإجابة ثم أعدها.</p><p>عدد الأخطاء الفريدة: '+arr.length+'</p>'+btn('اختبر أخطائي',"begin('mistakes')",'primary')+'</div>'+arr.map(x=>'<div class="card"><p class="question">'+esc(x[3])+'</p><p class="info">الإجابة: '+esc(x[4][x[5]])+' — '+esc(x[6])+'</p></div>').join('')}function resetSeen(){if(confirm('إعادة سجل التدريب فقط؟ ستبقى نتائج المحاكاة والأخطاء.')){state.seen=[];save();page('practice')}}function begin(kind,passageId){let ids=kind==='diagnostic'?DIAG:Q.filter(x=>kind==='grammar'?x[1]==='grammar':kind==='reading'?x[1]==='reading':kind==='passage'?x[2]===passageId:kind==='mistakes'?state.mistakes.includes(x[0]):true).map(x=>x[0]);if(kind!=='diagnostic'&&kind!=='review'&&kind!=='mistakes')ids=ids.filter(x=>!state.seen.includes(x));if(kind==='mock'||kind==='review')ids=ids.slice().sort(()=>Math.random()-.5).slice(0,20);if(!ids.length){alert('لا توجد أسئلة جديدة لهذه المجموعة. راجع الأخطاء أو أعد البنك.');return}sess={kind,ids,idx:0,answers:{},seconds:(kind==='mock'||kind==='review')?25*60:null};displayQ();if(sess.seconds!==null)timer=setInterval(()=>{if(!sess)return;--sess.seconds;const el=document.getElementById('clock');if(el)el.textContent=formatTime(sess.seconds);if(sess.seconds<=0)finish()},1000)}function formatTime(s){return Math.floor(Math.max(0,s)/60)+':'+String(Math.max(0,s)%60).padStart(2,'0')}function displayQ(){const x=one(sess.ids[sess.idx]);if(!x)return;const p=x[2]?P.find(p=>p.id===x[2]):null;let answered=sess.answers[x[0]]!==undefined;document.getElementById('view').innerHTML='<div class="card"><div class="toolbar"><b>السؤال '+(sess.idx+1)+' / '+sess.ids.length+'</b><span id="clock" class="pill">'+(sess.seconds===null?'تدريب بلا مؤقت':formatTime(sess.seconds))+'</span></div><progress max="'+sess.ids.length+'" value="'+(sess.idx+1)+'"></progress></div><div class="card">'+(p?'<h3>'+esc(p.title)+'</h3>'+chart(p)+'<div class="passage">'+esc(p.body)+'</div>':'<h3>قاعدة لغوية</h3>')+'<p class="question">'+esc(x[3])+'</p><div id="choices">'+x[4].map((v,i)=>'<button class="choice" onclick="answer('+i+')" '+(answered?'disabled':'')+'>'+String.fromCharCode(65+i)+') '+esc(v)+'</button>').join('')+'</div><div id="feedback"></div><div class="toolbar"><button class="btn primary" id="nextbtn" onclick="advance()" '+(!answered?'disabled':'')+'>'+(sess.idx===sess.ids.length-1?'إنهاء وظهور النتيجة':'السؤال التالي')+'</button><button class="btn" onclick="finish()">إنهاء الآن</button></div></div>';if(answered)paint(x,sess.answers[x[0]])}function paint(x,i){document.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===x[5])b.classList.add('correct');else if(j===i)b.classList.add('wrong')});document.getElementById('feedback').innerHTML='<div class="info"><b>'+(i===x[5]?'إجابة صحيحة!':'الإجابة الصحيحة: '+String.fromCharCode(65+x[5]))+'</b><p>'+esc(x[6])+'</p></div>';document.getElementById('nextbtn').disabled=false}function answer(i){if(!sess)return;const x=one(sess.ids[sess.idx]);if(sess.answers[x[0]]!==undefined)return;sess.answers[x[0]]=i;if(sess.kind!=='diagnostic'&&sess.kind!=='review'&&!state.seen.includes(x[0]))state.seen.push(x[0]);if(i!==x[5]&&!state.mistakes.includes(x[0]))state.mistakes.push(x[0]);save();paint(x,i)}function advance(){if(++sess.idx>=sess.ids.length)finish();else displayQ()}function finish(){if(!sess)return;if(timer){clearInterval(timer);timer=null}const n=Object.keys(sess.answers).length;const correct=sess.ids.filter(id=>sess.answers[id]===one(id)[5]);const g=sess.ids.filter(id=>one(id)[1]==='grammar'&&sess.answers[id]!==undefined);const r=sess.ids.filter(id=>one(id)[1]==='reading'&&sess.answers[id]!==undefined);const report={kind:sess.kind,date:new Date().toISOString(),correct:correct.length,total:n};state.results.push(report);if(sess.kind==='diagnostic')state.diagnostic=true;save();const completedAnswers=sess.answers;const val=(type)=>{let xs=type==='grammar'?g:r;return xs.length?xs.filter(id=>completedAnswers[id]===one(id)[5]).length+'/'+xs.length:'—'};sess=null;document.getElementById('view').innerHTML='<div class="card"><h2>🎉 نتيجة الجلسة</h2><div class="grid"><div class="metric"><b>'+correct.length+' / '+n+'</b><div>الإجابات الصحيحة</div></div><div class="metric"><b>'+val('grammar')+'</b><div>القواعد</div></div><div class="metric"><b>'+val('reading')+'</b><div>القراءة</div></div></div><p class="muted">'+(n?'النسبة: '+Math.round(correct.length/n*100)+'%. ':'لم تُجب عن أي سؤال. ')+'هذه نتيجة تدريبية وليست درجة STEP الرسمية.</p><div class="toolbar">'+btn('راجع أخطائي',"page('mistakes')",'primary')+btn('خطتي',"page('home')")+'</div></div>'}page('home');</script></html>
