<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STEP+ | مختبر القواعد</title><style>*{box-sizing:border-box}body{font:16px Tahoma,Arial;background:#eef7f8;color:#183749;margin:0}main{max-width:870px;margin:auto;padding:16px 14px 60px}.hero{border-radius:23px;background:linear-gradient(130deg,#173f57,#0b8d80);color:#fff;padding:23px}h1{margin:0 0 10px}.card{background:white;padding:19px;border-radius:16px;margin-top:15px;box-shadow:0 6px 20px #15374512}.muted{color:#5a7080;font-size:14px;line-height:1.8}.actions{display:flex;gap:7px;flex-wrap:wrap}button,.btn{border:0;border-radius:11px;background:#e4f1f4;color:#1a455a;padding:12px 16px;font:700 14px Tahoma,Arial;cursor:pointer;margin:3px}.primary{background:#108f85;color:white}a.btn{display:inline-block;text-decoration:none}details{border-bottom:1px solid #dcebef;padding:14px 0}summary{cursor:pointer;font-weight:700}.eng{direction:ltr;text-align:left;line-height:1.75}.answer{display:block;width:100%;text-align:left;direction:ltr;background:#f0f6fa;border:2px solid transparent;border-radius:12px;padding:13px;margin:7px 0;cursor:pointer;font:15px Arial}.good{border-color:#169a55;background:#def7e8}.bad{border-color:#dd5555;background:#ffe0e0}.explain{background:#eaf9f0;border-radius:13px;padding:15px;line-height:1.8}#quiz,#result{display:none}.tag{background:#fff0c5;border-radius:20px;font-size:12px;padding:5px 9px;color:#745009}progress{width:100%}</style><main><header class="hero"><h1>✏️ مختبر القواعد — STEP+</h1><p>شرح سريع ← تدريب موجّه ← اختبار بلا تكرار ← مراجعة الأخطاء.</p><p style="font-size:13px">أسئلة محاكية من إعدادي، وليست نقلًا مباشرًا من ملفات التجميعات أو أسئلة STEP رسمية.</p><a class="btn" href="./academy.html">الأكاديمية</a><a class="btn" href="./reading-tests.html">اختبارات القراءة</a></header><section class="card" id="menu"><h2>تعلّم وتدرّب</h2><p class="muted">6 وحدات أساسية و24 سؤالًا. راجع القاعدة أولًا ثم ابدأ الاختبار.</p><div id="stats"></div><div class="actions"><button class="primary" onclick="start('all')">تدريب شامل بلا تكرار</button><button onclick="start('mock')">محاكاة 15 دقيقة</button><button onclick="start('mistakes')">مراجعة أخطائي</button><button onclick="reset()">تصفير الأسئلة المستخدمة</button></div><div id="topics"></div></section><section class="card" id="quiz"><p><b id="prog"></b> <span class="tag" id="clock"></span></p><progress id="bar"></progress><h3 id="topic"></h3><div class="eng" id="question"></div><div id="choices"></div><div id="detail"></div><div class="actions"><button class="primary" id="next" disabled onclick="next()">التالي</button><button onclick="finish()">إنهاء التدريب</button></div></section><section class="card" id="result"><h2>نتيجة التدريب</h2><p id="grade"></p><div id="review"></div><button class="primary" onclick="home()">العودة للمختبر</button></section></main><script>const T=[{"id":"tense","name":"الأزمنة","lesson":"حدد زمن الحدث والعلاقة بين حدثين. By the time مع حدث ماضٍ غالبًا تحتاج Past Perfect للحدث الأسبق.","example":"By the time she arrived, the lecture had started."},{"id":"conditional","name":"الشرطيات","lesson":"Second conditional: if + past, would + base verb. Third conditional: if + had + V3, would have + V3.","example":"If I had known, I would have helped."},{"id":"passive","name":"المبني للمجهول","lesson":"المجهول = be في الزمن الصحيح + V3. انتبه أن الفعل الرئيسي لا يأتي بمصدر بعد was.","example":"The report was published last week."},{"id":"structure","name":"التراكيب والقلب","lesson":"بعد أدوات النفي المقدمة (Never / Rarely / In no way) يأتي المساعد قبل الفاعل. وراجع توافق الفاعل والفعل.","example":"Never have I seen such a result."},{"id":"forms","name":"Gerund و Infinitive","lesson":"بعد enjoy, avoid, suggest وحروف الجر يأتي V-ing غالبًا؛ بعد decide, agree, hope يأتي to + المصدر.","example":"She suggested taking a break."},{"id":"linkers","name":"الروابط والمقارنة","lesson":"Although/However للتعارض؛ Therefore/Thus للنتيجة؛ Comparative + than للمقارنة.","example":"The roads were flooded; therefore, the match was canceled."}];const Q=[{"id":"newg1","topic":"tense","q":"By the time the researchers published their findings, they _____ the data twice.","options":["reviewed","had reviewed","have reviewed","will review"],"correct":1,"why":"نشر النتائج حدث ماضٍ، ومراجعة البيانات سبقته؛ لذلك Past Perfect.","wrong":["reviewed","have reviewed","will review"]},{"id":"newg2","topic":"tense","q":"She _____ at the university since 2021 and still enjoys her work.","options":["worked","works","has worked","had worked"],"correct":2,"why":"since 2021 مع استمرار العمل حتى الآن → present perfect.","wrong":["worked","works","had worked"]},{"id":"newg3","topic":"tense","q":"When I entered the laboratory, the technicians _____ the instruments.","options":["were calibrating","calibrate","have calibrated","will calibrate"],"correct":0,"why":"حدث جارٍ في لحظة ماضية: past continuous.","wrong":["calibrate","have calibrated","will calibrate"]},{"id":"newg4","topic":"tense","q":"The train _____ before we reached the station yesterday.","options":["leaves","has left","had left","will leave"],"correct":2,"why":"الرحيل حدث قبل الوصول في الماضي: had left.","wrong":["leaves","has left","will leave"]},{"id":"newg5","topic":"conditional","q":"If the committee had received the report earlier, it _____ a different decision.","options":["makes","would make","would have made","will make"],"correct":2,"why":"شرط ثالث افتراضي في الماضي: would have + V3.","wrong":["makes","would make","will make"]},{"id":"newg6","topic":"conditional","q":"If I _____ more time today, I would revise another chapter.","options":["have","had","will have","had had"],"correct":1,"why":"شرط ثانٍ للتخيل الحاضر: if + past simple.","wrong":["have","will have","had had"]},{"id":"newg7","topic":"conditional","q":"Unless you _____ the instructions, you may miss an important detail.","options":["read","reads","will read","had read"],"correct":0,"why":"Unless في شرط حقيقي مستقبلي غالبًا بعدها present simple.","wrong":["reads","will read","had read"]},{"id":"newg8","topic":"conditional","q":"Had they checked the forecast, they _____ the outdoor event.","options":["postpone","will postpone","would postpone","would have postponed"],"correct":3,"why":"Had they checked = If they had checked؛ هذا شرط ثالث.","wrong":["postpone","will postpone","would postpone"]},{"id":"newg9","topic":"passive","q":"The new bridge _____ by local engineers in 2022.","options":["designed","was designed","has designing","is design"],"correct":1,"why":"زمن ماضٍ محدد مع مجهول: was + V3.","wrong":["designed","has designing","is design"]},{"id":"newg10","topic":"passive","q":"All applications must _____ before Friday.","options":["submit","be submitted","submitted","have submitting"],"correct":1,"why":"بعد modal must يكون المجهول must be + V3.","wrong":["submit","submitted","have submitting"]},{"id":"newg11","topic":"passive","q":"The results _____ to the public next week.","options":["will announce","will be announced","announcing","have announce"],"correct":1,"why":"مجهول مستقبلي: will be announced.","wrong":["will announce","announcing","have announce"]},{"id":"newg12","topic":"passive","q":"The experiment _____ several times before the conclusions were accepted.","options":["had been repeated","has repeating","was repeat","would repeating"],"correct":0,"why":"حدث مكتمل قبل ماضٍ آخر، بالمجهول: had been + V3.","wrong":["has repeating","was repeat","would repeating"]},{"id":"newg13","topic":"structure","q":"Rarely _____ such a clear explanation.","options":["we hear","do we hear","we do hear","hear we"],"correct":1,"why":"Rarely في البداية يتطلب inversion: do + we + hear.","wrong":["we hear","we do hear","hear we"]},{"id":"newg14","topic":"structure","q":"Neither the students nor the instructor _____ late.","options":["are","were","is","be"],"correct":2,"why":"في neither…nor يراعي الفعل الأقرب instructor المفرد.","wrong":["are","were","be"]},{"id":"newg15","topic":"structure","q":"Each of the participants _____ a certificate.","options":["receive","receiving","have received","has received"],"correct":3,"why":"Each مفرد نحويًا: has received.","wrong":["receive","receiving","have received"]},{"id":"newg16","topic":"structure","q":"Not only _____ the assignment, but she also presented it confidently.","options":["she completed","did she complete","she did complete","completed she"],"correct":1,"why":"Not only في البداية + inversion: did she complete.","wrong":["she completed","she did complete","completed she"]},{"id":"newg17","topic":"forms","q":"The supervisor suggested _____ the schedule.","options":["change","to change","changing","changed"],"correct":2,"why":"suggest + ing في هذا السياق.","wrong":["change","to change","changed"]},{"id":"newg18","topic":"forms","q":"They decided _____ the survey before Friday.","options":["finish","finishing","finished","to finish"],"correct":3,"why":"decide + to-infinitive.","wrong":["finish","finishing","finished"]},{"id":"newg19","topic":"forms","q":"She is interested in _____ more about economics.","options":["learn","learning","to learn","learned"],"correct":1,"why":"بعد حرف الجر in يأتي V-ing.","wrong":["learn","to learn","learned"]},{"id":"newg20","topic":"forms","q":"The student avoided _____ the same mistake again.","options":["make","making","to make","made"],"correct":1,"why":"avoid + V-ing.","wrong":["make","to make","made"]},{"id":"newg21","topic":"linkers","q":"The experiment was expensive; _____, it provided valuable evidence.","options":["therefore","however","because","although"],"correct":1,"why":"تعارض بين الكلفة والفائدة؛ however.","wrong":["therefore","because","although"]},{"id":"newg22","topic":"linkers","q":"The roads were closed; _____, the team delayed the trip.","options":["nevertheless","although","therefore","despite"],"correct":2,"why":"تأخر الرحلة نتيجة إغلاق الطرق؛ therefore.","wrong":["nevertheless","although","despite"]},{"id":"newg23","topic":"linkers","q":"This explanation is _____ than the previous one.","options":["clear","clearer","clearest","clearly"],"correct":1,"why":"than تستلزم المقارنة clearer.","wrong":["clear","clearest","clearly"]},{"id":"newg24","topic":"linkers","q":"_____ the evidence was limited, the researchers continued the study.","options":["Because of","Despite","Although","Therefore"],"correct":2,"why":"Although بعدها جملة كاملة وتعبر عن تعارض.","wrong":["Because of","Despite","Therefore"]}];const K='step-plus-grammar-study-v1';let state={used:[],wrong:[]};try{state={...state,...JSON.parse(localStorage.getItem(K)||'{}')}}catch{}let queue=[],pos=0,answers={},timer=null,seconds=0;const save=()=>localStorage.setItem(K,JSON.stringify(state));function stats(){document.getElementById('stats').textContent='المتبقي: '+Q.filter(x=>!state.used.includes(x.id)).length+' من '+Q.length+' • أخطاء للمراجعة: '+state.wrong.length}function showTopics(){document.getElementById('topics').innerHTML=T.map(t=>'<details><summary>'+t.name+'</summary><p>'+t.lesson+'</p><p class="eng">'+t.example+'</p><button class="primary" onclick="start(\''+t.id+'\')">تدرب على '+t.name+'</button></details>').join('')}function start(kind){queue=Q.filter(x=>kind==='all'||kind==='mock'||kind==='mistakes'&&state.wrong.includes(x.id)||x.topic===kind).filter(x=>kind==='mistakes'||!state.used.includes(x.id));if(kind==='mock')queue=queue.sort(()=>Math.random()-.5).slice(0,20);if(!queue.length){alert('انتهت الأسئلة الجديدة لهذا القسم؛ اختر قسمًا آخر أو أعد ضبط السجل.');return}pos=0;answers={};document.getElementById('menu').style.display='none';document.getElementById('result').style.display='none';document.getElementById('quiz').style.display='block';seconds=kind==='mock'?900:0;if(seconds){timer=setInterval(()=>{seconds--;document.getElementById('clock').textContent='⏱ '+Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');if(seconds<=0)finish()},1000)}else document.getElementById('clock').textContent='بدون مؤقت';draw()}function draw(){const q=queue[pos];document.getElementById('prog').textContent='السؤال '+(pos+1)+' من '+queue.length;document.getElementById('bar').max=queue.length;document.getElementById('bar').value=pos+1;document.getElementById('topic').textContent=T.find(t=>t.id===q.topic).name;document.getElementById('question').textContent=q.q;document.getElementById('choices').innerHTML='';document.getElementById('detail').innerHTML='';document.getElementById('next').disabled=true;q.options.forEach((o,i)=>{const b=document.createElement('button');b.className='answer';b.textContent='ABCD'[i]+') '+o;b.onclick=()=>answer(i);document.getElementById('choices').appendChild(b)})}function answer(i){const q=queue[pos];if(answers[q.id]!==undefined)return;answers[q.id]=i;if(!state.used.includes(q.id))state.used.push(q.id);if(i!==q.correct&&!state.wrong.includes(q.id))state.wrong.push(q.id);if(i===q.correct)state.wrong=state.wrong.filter(x=>x!==q.id);save();document.querySelectorAll('.answer').forEach((b,j)=>{b.disabled=true;if(j===q.correct)b.classList.add('good');else if(j===i)b.classList.add('bad')});document.getElementById('detail').innerHTML='<div class="explain"><b>الصحيح: '+('ABCD'[q.correct])+') '+q.options[q.correct]+'</b><p>'+q.why+'</p><p>خيارات أخرى لا تنطبق على القاعدة المستهدفة: '+q.options.filter((_,j)=>j!==q.correct).join(' • ')+'</p></div>';document.getElementById('next').disabled=false;stats()}function next(){pos++;if(pos<queue.length)draw();else finish()}function finish(){if(timer){clearInterval(timer);timer=null}document.getElementById('quiz').style.display='none';document.getElementById('result').style.display='block';const done=queue.filter(q=>answers[q.id]!==undefined),ok=done.filter(q=>answers[q.id]===q.correct),bad=done.filter(q=>answers[q.id]!==q.correct);document.getElementById('grade').textContent='أجبت صحيحًا عن '+ok.length+' من '+done.length+' ('+(done.length?Math.round(ok.length/done.length*100):0)+'%).';document.getElementById('review').innerHTML=bad.map(q=>'<p class="explain"><b>'+q.q+'</b><br>الصحيح: '+q.options[q.correct]+'<br>'+q.why+'</p>').join('');stats()}function home(){document.getElementById('menu').style.display='block';document.getElementById('quiz').style.display='none';document.getElementById('result').style.display='none';stats()}function reset(){if(confirm('هل تريد إعادة السماح بكل الأسئلة؟')){state.used=[];save();stats()}}stats();showTopics();</script>
