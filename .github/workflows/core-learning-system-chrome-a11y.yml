name: English+ core learning scoped WCAG via installed Chrome
on:
  push:
    branches: [qa/core-learning-e2e-20261026]
    paths:
      - 'tests/browser/core-learning.spec.mjs'
      - 'tests/playwright-system-chrome.config.mjs'
      - 'index.html'
      - 'academy.html'
      - 'reading-tests.html'
      - '.github/workflows/core-learning-system-chrome-a11y.yml'
  pull_request:
    paths:
      - 'tests/browser/core-learning.spec.mjs'
      - 'tests/playwright-system-chrome.config.mjs'
      - 'index.html'
      - 'academy.html'
      - 'reading-tests.html'
      - '.github/workflows/core-learning-system-chrome-a11y.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scoped-a11y:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Verify installed Chrome and test syntax
        run: |
          command -v google-chrome
          google-chrome --version
          node --check tests/browser/core-learning.spec.mjs
          node --check tests/playwright-system-chrome.config.mjs
      - name: Install pinned Playwright and local axe-core test runner only
        run: npm install --no-save @playwright/test@1.64.1 @axe-core/playwright@4.14.0
      - name: Run three core learning WCAG smoke cases (localhost Chrome)
        run: npx playwright test -c tests/playwright-system-chrome.config.mjs
