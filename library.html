<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مكتبة ستيب بلس الأسبوعية</title><style>body{font-family:Tahoma,Arial;margin:0;background:#f1f7fa;color:#143648}*{box-sizing:border-box}main{max-width:960px;margin:auto;padding:18px}.hero{background:linear-gradient(120deg,#12394f,#087b75);color:white;border-radius:24px;padding:25px}a{color:inherit}.btn{display:inline-block;background:#b2f4e5;color:#12454b;padding:12px;border-radius:12px;text-decoration:none;margin:6px 4px}.card{background:white;border-radius:16px;padding:18px;margin:13px 0;box-shadow:0 5px 20px #1232450e}input{font:inherit;width:100%;padding:14px;border:1px solid #cbdfe9;border-radius:12px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.star{background:#fef3c7;padding:5px 10px;border-radius:24px;white-space:nowrap;color:#92580d}.passage{white-space:pre-wrap;direction:ltr;text-align:left;line-height:1.85;font:15px/1.85 Georgia,Arial;background:#f4f8fa;padding:16px;border-radius:12px;overflow-wrap:anywhere}.muted{font-size:13px;color:#526d80;line-height:1.8}summary{cursor:pointer;line-height:1.7}button{background:#0b9689;color:white;border:0;padding:10px 13px;border-radius:10px;cursor:pointer;font:inherit}details[open]{border:2px solid #9dd9d0}@media(max-width:560px){main{padding:10px}.hero{padding:20px}}</style><main><div class="hero"><h1>📖 مكتبة القراءة الأسبوعية</h1><p>21 موضوعًا ذا ★5 أو ★4 وفق فهرس تجميعات 11–15 أكتوبر 2026، مرتبة بالأولوية. محتوى النصوص مأخوذ من صفحات الملفات المرفقة للمذاكرة، والرسوم معروضة بوصف نصي بدل الصورة الأصلية.</p><a class="btn" href="./academy.html">🎓 الأكاديمية والتدريب</a><a class="btn" href="./">الرئيسية</a></div><section class="card"><input id="search" placeholder="ابحث عن قطعة باللغة الإنجليزية..." oninput="render()"><p class="muted" id="count"></p></section><div id="list"></div></main><script>const D=[{"id":"passage-1","name":"A Graph Regarding Hajj Pilgrims","stars":5,"pages":"3","text":"","chart":"الحجاج: يوضح الرسم أعداد الحجاج من داخل السعودية وخارجها من 2004 إلى 2014؛ أعلى إجمالي عام 2012، وأعلى عدد من خارج السعودية ضمن خيارات سؤال الملف عام 2010."},{"id":"passage-2","name":"Controlling Inflation","stars":5,"pages":"4–6","text":"Passage A (1) Inflation occurs when an economy grows due to increased spending. When this happens, prices rise and the currency within the economy is worth less than it was before; the currency essentially won't buy as much as it would before. (2) There are many methods used to control inflation; some work well while others may have damaging effects. For example, controlling inflation through wage and price controls can cause a recession and cause job losses. Contractionary Monetary Policy (3) One popular method of controlling inflation is through a contractionary monetary policy. The goal of a contractionary policy is to reduce the money supply in the economy by decreasing bond prices and increasing interest rates. This helps reduce spending because when there is less money to go around, those who have money want to keep it and save it, instead of spending it. Reserve Requirements (4) The second tool is to increase reserve requirements on the amount of money banks are legally required to keep on hand to cover withdrawals. The more money banks are required to hold back, the less they have to lend to consumers. Fiscal Policy (5) The government can also increase taxes (such as income tax and VAT) and cut spending. This improves the budget situation and helps to reduce demand in the economy. (6) Both these policies reduce inflation by reducing the growth of aggregate demand. If economic growth is rapid, reducing the growth of AD can reduce inflationary pressures without causing a recession. (7) If a country had high inflation and negative growth, then reducing aggregate demand would be more unpalatable, as reducing inflation would lead to lower output and higher unemployment. They could still reduce inflation, but it would be much more damaging to the economy. Passage B (1) For any economy, inflation is a complex phenomenon. While moderate inflation is usually good for an economy, if it goes beyond that, then it can cause a disastrous situation for the economy. The government takes different measures to control inflation of different types, as explained below. Demand-Pull Inflation Control (2) In order to control demand-pull inflation, the government undertakes some monetary measures and incorporates certain changes to the fiscal policy. Monetary Measures","chart":null},{"id":"passage-3","name":"The Spanish Flu","stars":5,"pages":"7–8","text":"From 1918 to 1920 the virus known as the Spanish Flu infected 500 million people worldwide, killing 50 to 100 million of them. The only continent it did not reach was Antarctica; deaths were registered from northern Alaska to the islands of Samoa. The virus began in conditions that were perfect to help it spread across the globe, turning the battlefields of World War I into huge centers of infection. Though the flu had long been a familiar disease, the subtype (special type) of 1918 took scientists by surprise. They were shocked as much by the speed of its spread as by the number of people it killed. Though some experts believe the virus's origins were in Europe, the theory most accepted today suggests that it began in the United States, and later travelled on an army ship to the battlefields of France. From there, an army of disease germs, like enemy soldiers in a secret war, spread out through the air and infected a third of the world's population, killing between 2.5% and 5% of everyone on earth. In the future, suggests the World Health Organization, there will be more and perhaps more deadly flu pandemics (worldwide diseases), threatening global health and security and putting the future of human society at risk. The virus won't need a great war to help it cover the earth; it will be enough for one carrier to get on an airplane and, in less than 20 hours, cover the distance between Tokyo and New York, or between Sydney and Doha.","chart":null},{"id":"passage-4","name":"Survey on Why People Travel","stars":5,"pages":"9","text":"","chart":"السفر: زيارة الأصدقاء أو الأقارب 33%، الترفيه 30%، العمل 22.5%، أعمال شخصية 14.6%."},{"id":"passage-5","name":"California Strawberries","stars":5,"pages":"10–12","text":"(1) Agricultural abundance is a pillar of the California dream. In 2016 the state turned out more than $45 billion worth of meat, milk and crops. Long before nutritionists agreed that fresh fruits and vegetables should be the center of American diets, California farmers had planted much of their land in these products, and today they produce half of the nation's fruits, vegetables and nuts. (2) But although fruits and vegetables are vaunted as healthy foods, their impact as crops is quite different. On many California produce farms wages are low, working conditions are poor and farmers use enormous quantities of pesticides and precious water. This is the central contradiction of California agriculture. (3) California's strawberry industry is the state's sixth most important commodity in terms of the value of crops sold. Strawberries are attractive, reasonably nutritious and occasionally tasty fruits and can be grown and eaten within California nearly year-round. But the industry's growth has relied on heavy use of toxic chemicals, and now growers face heightened restrictions on some of their most favored chemicals: soil fumigants. (4) Unfortunately, less toxic or non-chemical strategies that would allow strawberries to be grown for a mass market, maintaining affordable prices, are elusive and likely to remain so. (5) Although strawberry production once was scattered throughout the state, by the 1960s it had concentrated in coastal zones to take advantage of sandy soils and mild temperatures. Thereafter, the industry saw tremendous growth in productivity. In Monterey and Santa Cruz counties alone, acreage more than tripled and production increased tenfold from 1960 to 2014. Much of this growth was enabled by advances in plant breeding and use of plastic tarps to absorb heat, allowing growers to increase the length of strawberry seasons. (6) But the main driver of growth has been the use of pre-plant chemical fumigants. Growers hire pest control companies to fumigate soils before planting strawberries in order to kill soil-borne pests—most importantly, plant pathogens such as Verticillium dahliae and Macrophomina phaseolina. Without such treatment, these pathogens cause strawberry plants to wilt and die. (7) Now, however, the industry's fumigant of choice, methyl bromide, can no longer be used in strawberry fruit production. In 1991 methyl bromide was banned under the Montreal Protocol on Substances that Deplete the Ozone Layer, although it is still used in nursery production to ensure that starter plants are virus- and pathogen-free. One potential replacement, methyl iodide, was approved for use in late 2010. But it was withdrawn from the market in 2012, following an activist campaign and lawsuit that accused California regulators of performing an inadequate review of potential health risks to workers and the general public. Among other things, the chemical is a known neurotoxin and carcinogen.\n\n(8) Other fumigants are still allowed, but their use is increasingly restricted by buffer zones and township quotas. Consequently, growers are contending with heightened levels of plant disease, some from pathogens that had never before been evident in California strawberry fields. (9) Can California find a less toxic way to raise 90 percent of the nation's fresh strawberries? Although the strawberry industry is investing significant resources into non-chemical alternatives to manage soil-borne disease, the obstacles are formidable. The entire production system, including reliance on fumigants, is embedded into the cost of land. (10) Fumigation has allowed growers to plant on the same blocks of land year after year and not worry about soil disease. (11) Together these innovations have allowed growers to keep prime strawberry land in production every year for much of the year, yielding exceptional amounts of fruit. High land prices reflect these expectations and make it unprofitable to grow strawberries using less intensive methods. The Pacific Ocean's natural summer air-conditioning is attractive to suburbanites as well as strawberries, so coastal development is putting additional pressure on the cost of strawberry land while at the same time increasing public pressure to control use of fumigants. (12) Informed and concerned consumers ingrained with California's deep culture of environmentalism have turned to organic strawberries, which they see as a more sustainable option. As conventional growers took note of this vibrant market, organic strawberry production rose fivefold between 2000 and 2012, to reach about 3,300 acres planted in 2017, which represents 12 percent of all strawberry acreage. (13) But although organic growers use non-chemical soil fumigation methods or rotate strawberries with crops that have a mild disease-suppressing effect, such as broccoli, few of them fundamentally alter the production system in other ways. fumigants. However, even they use starter plants produced on fumigated soil, since no nurseries produce organic plants. Crucially, for these growers strawberries are a minor crop in what are otherwise highly diversified systems. And most of these producers are located outside of prime strawberry growing regions, where land is cheaper. Their approach therefore is not nearly replicable for growers producing for the mass market.","chart":null},{"id":"passage-6","name":"Yellowstone National Park","stars":4,"pages":"13–15","text":"(1) Established in 1872, Yellowstone National Park is not only the oldest national park in the United States but also in the world. It is also one of the largest, and probably the best-known, national parks in the United States. It is located principally in northwestern Wyoming and partly in southern Montana and eastern Idaho. The park, which forms a square-like rectangle, is 63 miles (101 kilometers) from north to south and 54 miles (87 kilometers) from east to west at its widest point; it covers an area of 3,472 square miles (8,992 square kilometers). Grand Teton National Park lies to the south, and on all other sides Yellowstone is surrounded by national forests. Yellowstone's headquarters are at Mammoth Hot Springs near the northern entrance to the park. (2) Most of the park consists of broad volcanic plateaus with an average elevation of about 7,875 feet (2,400 meters). Three mountain ranges, each running roughly north to south, protrude into the park: the Gallatin Range in the northwest, the Absaroka Range in the east, and the northern extremity of the Teton Range along the park's southwestern boundary. The tallest mountains in the park are in the Absarokas, where many summits exceed elevations of 10,000 feet (3,050 meters). The range's Eagle Peak, on the park's boundary in the southeast, is the high point, reaching 11,358 feet (3,462 meters). Within its rugged mountains are spectacular deep glacier-carved valleys. (3) Yellowstone is also known for its many scenic lakes and rivers. The park's largest body of water is Yellowstone Lake, which has a surface area of 132 square miles (342 square kilometers) and lies at an elevation of 7,730 feet (2,356 meters), making it the highest mountain lake of its size in North America. The Yellowstone River enters at the southeast corner, flows generally northward (including through Yellowstone Lake), and exits near the northwest corner of the park. The river's Yellowstone Falls, located in the north- central part of the park, descend in two majestic cascades. The falls constitute the western end of the spectacular Grand Canyon of the Yellowstone. There the river has cut a gorge 19 miles (30 kilometers) The walls of the canyon are brilliantly colored in hues of red, pink, yellow, buff, lavender, and white. (4) Yellowstone's other noted geysers and thermal features include Giantess Geyser, with a two- to six- month wait between eruptions; Excelsior Geyser, which rarely erupts but discharges thousands of gallons of boiling water per minute; and the Fountain Paint Pots, with pink, plopping mud geysers, fumaroles, and a blue hot-spring pool. Steamboat Geyser can throw water to heights of 300 feet (90 meters) and higher and is the world's highest-erupting geyser. Mammoth Hot Springs consists of a broad terraced hillside of travertine (calcium carbonate) deposited there by dozens of hot springs; some of the dazzling white rock is tinted by microorganisms on the rock.\n\n(5) Yellowstone's climate is influenced by the park's high average elevation, location deep within the continent, and mountainous terrain. Temperatures almost always decrease with elevation gain. Because of Yellowstone's large area and variegated topography, weather conditions at different locations within the park can vary widely at any given time. In addition, conditions can change dramatically in a short period of time at one location. (6) Summer days are warm and relatively sunny, with daytime temperatures reaching about 80 °F (27 °C) in July at lower elevations before dropping to nighttime lows in the 40s or 50s °F (about 10 °C); temperatures are usually cooler higher in the mountains. Although precipitation totals in the warm months generally are light, summer afternoon thunderstorms are common. Winters are cold and snowy, as temperatures rarely rise above the mid-20s °F (about –4 °C) and often drop to 0 °F (–18 °C) or lower at night. Snowfall is heavy in most areas, especially at higher elevations, and typically begins in early autumn and continues into April or May. (7) About four-fifths of the park's area is forested, and the vast majority of the tree growth consists of lodgepole pines. Among the several other conifer species in the park are whitebark pine, found at higher elevations; and Douglas firs, which dominate at lower elevations. Cottonwoods and willows grow along streams, and stands of aspens occur in many sections. A significant event in Yellowstone's more recent history was the great fire of 1988 that charred some two-fifths of the park's forestlands. The forests subsequently have recovered, although areas have been subject to damage by insect pests. Hundreds of types of wildflowers thrive in a variety of habitats. Common species include phlox, lupines, cinquefoils, larkspurs, and Indian paintbrushes.","chart":null},{"id":"passage-7","name":"Engineering Innovation","stars":4,"pages":"16–17","text":"(1) Rome is known for many things: its military conquests, its civic architecture, temples, roads, emperors, and sculpture. Yet none of these would have been possible without the most vital resource of all: water. Now, as then, water is life, and without effective distribution, there would have been no great Roman civilization. Even until relatively modern times, Roman techniques to collect, store, and channel water over huge distances remain unsurpassed. (2) Such technology was not, of course, invented from scratch by the Romans, and many earlier Mediterranean peoples had poured resources and expertise into managing water. On the island of Crete, the Minoans developed sophisticated rain-harvesting and filtering systems as early as the middle of the third millennium B.C. Cretan water management techniques were later adopted across the Greek-speaking world, and examples abound of tunnels, drainage systems, and cisterns, sometimes of considerable size. (3) Yet although the water management tradition Rome inherited was rich and extensive, no previous system came close to the sophistication and reach of the Roman aqueduct. Striding across the landscape from Spain to Syria, these awe-inspiring structures not only carried life and livelihood but also proclaimed the greatness of Rome. (4) Aqueducts were costly public works, and not all Roman cities necessarily required them. Some cities, such as Pompeii, had their water needs met by wells or public and private cisterns dug beneath houses. Some cisterns could reach a colossal size, such as the Basilica Cistern (Yerebatan Sarnıcı) in Constantinople (now Istanbul, Turkey) and the Piscina Mirabilis in Miseno, Italy. The cities built to provide drinking water to large populations such as Rome's—thought to have reached one million in the first century A.D.—needed an entire system of aqueducts not only for drinking water but also for supplying ornamental public fountains and baths. (5) Rome was supplied by aqueducts totaling 315 miles in length. Of that, 269 miles ran underground and 46 total miles above ground; however, only about 36 miles consisted of arched structures, just under 12 percent in all. (6) Rome had as many as 11 aqueduct systems, the most ancient of which was the mile-long Aqua Appia, first operational in 312 B.C. It was named for its sponsor, the censor Appius Claudius Caecus, better known for another great pioneering structure of ancient Rome: the Appian Way, one of the first major Roman roads.","chart":null},{"id":"passage-8","name":"Mercantilism & Absolute Advantage","stars":4,"pages":"18–19","text":"Passage A: Mercantilism (1) Developed in the sixteenth century, mercantilism was one of the earliest efforts to develop an economic theory. This theory stated that a country's wealth was determined by the amount of its gold and silver holdings. In its simplest sense, mercantilists believed that a country should increase its holdings of gold and silver by promoting exports and discouraging imports. In other words, if people in other countries buy more from you (exports) than they sell to you (imports), then they have to pay you the difference in gold and silver. The objective of each country was to have a trade surplus, or a situation where the value of exports is greater than the value of imports, and to avoid a trade deficit, or a situation where the value of imports is greater than the value of exports. (2) A closer look at world history from the 1500s to the late 1800s helps explain why mercantilism flourished. The 1500s marked the rise of new nation-states, whose rulers wanted to strengthen their nations by building larger armies and national institutions. By increasing exports and trade, these rulers were able to amass more gold and wealth for their countries. One way that many of these new nations promoted exports was to impose restrictions on imports. This strategy is called protectionism and is still used today. Passage B: Absolute Advantage","chart":null},{"id":"passage-9","name":"Automation","stars":4,"pages":"20–21","text":"(1) Knowing how and where robots and machines could impact the global economy will help financial executives gain a competitive edge in their industries, but predicting which countries are likely to be impacted most by workforce automation and when isn't as simple as comparing industries across the globe. (2) A recent McKinsey Global Institute report, A Future That Works: Automation, Employment, and Productivity, analyzed the automation potential of 46 countries, representing 80% of the global workforce. Several factors are considered, including the percentage of work activities that could be automated using current technology, the number of full-time employees that could be affected and wages. (3) The types of activities that have a high potential for automation are physical tasks in highly structured and predictable environments, data processing and data collection. Those that have a considerably lower potential for automation are unpredictable physical work, interactions with others, applying expertise, and managing others, which is the least susceptible to automation. (4) Vast differences are expected in how automation will play out across the globe, as technical, economic, and social factors will determine the pace and extent of it. But it's hard to say how quickly automation will become reality, according to the report. (5) Take manufacturing, for example. One country may have a larger concentration of work hours in jobs that have higher automation potential, such as production and administrative support. And another country may have a higher proportion of work hours in jobs that are less likely to be automated, such as management and engineering.","chart":null},{"id":"passage-10","name":"Matryoshka Dolls (Russian Doll)","stars":4,"pages":"22–23","text":"(1) A matryoshka doll refers to a set of dolls of decreasing size placed one inside the other. The word \"matryoshka\" is a diminutive form of the Russian female first name \"Matryona.\" The first doll set in Russia was carved in 1890 by Vasily Zvyozdochkin from a design by Sergey Malyutin, who was a folk crafts painter. Traditionally the outer layer is a woman, dressed in a sarafan, a long traditional Russian dress. (2) A set of matryoshkas consists of a wooden figure which separates, top from bottom, to reveal a smaller figure of the same sort inside, which has, in turn, another figure inside of it, and so on. The number of nested figures is traditionally not less than five, but can be much more, up to several dozen with sufficiently fine craftsmanship. Modern dolls often yield an odd number of figures but this is not an absolute rule; the original set, for instance, had an even number. The form is approximately cylindrical, with a rounded top for the head, tapering toward the bottom, but with no protruding features. (3) It is believed Zvyozdochkin and Malyutin were inspired by a doll from Honshu, the main island of Japan. Sources differ in their descriptions, describing either a round, hollow doll or a nesting doll portraying a bald old Buddhist monk. (4) Zvyozdochkin's creations were first presented at the Exposition Universelle in the year 1900 in Paris, where the toy earned a bronze medal. Soon after, matryoshka dolls were being made in several places in Russia and shipped around the world, including to Europe, Asia and America. (5) Matryoshka dolls are often designed to follow a particular theme, and during Perestroika, the leaders of the Soviet Union became a common theme of matryoshkas. In one such example, the largest, outside figure was that of Mikhail Gorbachev, followed by Leonid Brezhnev (Yuri Andropov and Konstantin Chernenko almost never appear due to the short length of their respective terms), Nikita Khrushchev, Joseph Stalin and finally the smallest, Vladimir Lenin.","chart":null},{"id":"passage-11","name":"Stress","stars":4,"pages":"24–25","text":"(1) We generally use the word \"stress\" when we feel that everything seems to have become too much. We are overloaded and wonder whether we really can cope with the demands placed upon us. Anything that poses a challenge or a threat to our well-being is a stress. Without stress at all, many say our lives would be boring and would probably feel pointless. However, when the stresses affect both our mental and physical health, they are bad. (2) The way we respond to a challenge may also be a type of stress. Part of our response to a challenge is physiological and affects our physical state. When faced with a challenge or a threat, our body activates resources to protect us: to either get away as fast as we can, or fight. This is known as our 'fight-or-flight' response. (3) If you are upstairs at home and an earthquake starts, the faster you can get yourself, and anyone else who might be at home, out, the more likely you are all to survive. If you need to save somebody's life during that earthquake by lifting a heavy weight that has fallen on them, you will need parts of your body to be activated to give you more strength. (4) To do this, our body produces larger quantities of the chemicals cortisol, adrenaline and noradrenaline, which trigger it to have a higher heart rate, heightened muscle preparedness, sweating, and alertness. All these factors help us protect ourselves in a dangerous or challenging situation. (5) Non-essential body functions slow down, such as our digestive and immune systems, when we are in a 'fight-or-flight' situation. All resources can then be concentrated on rapid breathing, blood flow, alertness and muscle use. (6) Most of us have varying interpretations of what stress is about and what matters. Some of us focus on what happens to us, such as breaking a bone or getting a promotion, while others think more about the event itself. In my opinion, what really matters are our thoughts about the situations in which we find ourselves.","chart":null},{"id":"passage-12","name":"Aggression in Children","stars":4,"pages":"26–27","text":"(1) Most parents do not enjoy watching their children misbehave. Bad behavior by children often results in bad behavior by parents. The first idea that has to go is that poor parenting is what makes children misbehave or behave badly. The cause of the child's behavior may lie in psychological problems; it may even lie in the biology of the child. Whatever the reason, the important issue is how parents respond when children act out. (2) Aggressive behavior starts early in children's lives. A study looked at children 6 to 24 months of age. Mothers reported how often their children acted out, or displayed poor behavior. They cited kicking, hitting, pulling hair, biting and even hurting animals. The most common actions were hitting or smacking another person. The least common action was hurting animals. Hitting someone peaked at 18 months, when eight of 10 kids were hitting and smacking other people. Kicking, pushing and throwing things peaked at 20 months. The \"terrible twos\" started before the age of two. (3) Pediatricians can assure parents that these behaviors are normal in small children. The big job is to guide parents on how to deal with their children when they behave this way. From the start, parents should set limits. They need to respond in ways that may help redirect or distract a child. This would help a child go from misbehaving to a more positive behavior. Pediatricians believe these approaches work. It seems certain that positive responses such as these are better than anger or punishment. (4) The frequency, intensity, and length of the bad behavior are also important. There are some questions that parents must also consider. Does the child have any issues that he or she is dealing with? Does the child have friends? Some children may show signs of depression when they have had a negative experience. The answers to these questions may explain why the child is acting out. (5) Parents often use their instincts in dealing with their children without considering what is causing the misbehavior. They may respond with anger, threats, and punishment. A better way is to plan in order to avoid potential conflicts. For example, if getting ready for school is a problem, parents can come up with ways to make it easier. This would help them to avoid potential problems before they start.","chart":null},{"id":"passage-13","name":"Software Ownership","stars":4,"pages":"28–29","text":"Most people know that software can be very expensive. However, many people do not know that even though you pay a lot for software, you do not necessarily own it. What happens, then, when you pay for a piece of software? Very few developers grant you actual ownership of a program, even after you 'purchase' it. Instead of buying the software itself, you are actually paying for a license that grants you permission to install and use the software. Why a License? Software developers have good reason for licensing software instead of selling it outright: Piracy – software piracy, which costs developers billions of dollars every year, is the act of copying software without the developer's consent and without paying the developer and then selling or giving away the copies. If you install the program on multiple computers at the same time, that is piracy too. By licensing their products and maintaining some ownership of them, developers can take action against pirates. Modifications – Most license agreements state that you cannot make modifications to a program's source code. If developers allowed this, it would be an easy matter for others to make changes to a program and then try to claim the modified program as their own. But even though the developer keeps most rights to a program, you have some rights, too. If the program does not perform as you expected, you have the right to return or exchange it.","chart":null},{"id":"passage-14","name":"Nanotechnology","stars":4,"pages":"30–31","text":"(1) Anybody who doesn't know much about nanotechnology should begin with geckos. These are the lizards that are probably the world's best climbers. Watching them climb upside down on a horizontal pane of glass, you realize that Spider-Man should really have been called Gecko Man. These guys out-climb spiders any day. (2) With perfect ease they can hang from a single toe, and they do so by pure adhesion, not by sticking a toe in a hole or by curling it round something they can grip. With all the toes on the glass, scientists guess that if the rest of the body were strong enough it could take the weight of a 100kg person suspended below it. Although each toe is equipped with a tiny hook-like claw at the end, these are of no use on the glass. What keeps them up there is the amazing structure of the skin of the toe. (3) Seen under the microscope, each toe has around two million tiny hairs on its underside. Under the higher magnification of an electron microscope the end of each of these hairs is seen to split into hundreds of even tinier nano-hairs, which scientists have called spatulae. These hairs are so small that they are able to establish contact with the molecular structure of the surface the gecko is walking on. With that near- perfect contact the hairs are stuck to the surface by electromagnetic forces called Van der Waals forces. The molecules on the feet and on the surface have areas of slight positive or negative charge that attract each other like mini magnets when they get really close. (4) Scientists have been working for over 15 years now to try to unlock the secrets of the stickiness of gecko toes and find a way to artificially reproduce the same structure of nano-hairs. The hypothesis at the moment is that if any material can be shaped into nano-hairs they will have the same properties as those on gecko toes, so scientists are looking for a different material with which to make the stickiest synthetic surface ever. (5) This is one example of research in the field now known as nanotechnology. In this field, the technology being created can be measured in a few nanometers (one nanometer is a millionth of a millimeter). Interest in developing technology at this level was largely inspired by Richard Feynman at the beginning of the 1960s, but the 'nano' catchphrase was coined in the 1990s by Dr. Eric Drexler, who spurred scientists on through a series of speeches and a book with the title \"Engines of Creation: The Coming Era of Nanotechnology\".","chart":null},{"id":"passage-15","name":"Energy Producers and Consumers","stars":4,"pages":"32","text":"(1) At the core of every organism's interaction with the environment is its need for energy to power its life processes. Ants use energy to carry objects many times their size. Birds use energy to migrate thousands of miles. You need energy to get out of bed in the morning! Where does energy in living systems come from? How is it transferred from one organism to another? (2) Living systems operate by expending energy. Organisms need energy for growth, reproduction, and their own metabolic processes. In short, if there is no energy, there are no life functions. Yet, no organism can create energy—organisms can only use energy from other sources. You probably know that you get your energy from the plants and animals you eat. But where does the energy in this food come from? For most life on earth, sunlight is the ultimate energy source. Over the last few decades, however, through research, experts have discovered that there are other energy sources for life. For some organisms, chemical energy stored in inorganic chemical compounds serves as the ultimate energy source for life processes. (3) Only algae, certain bacteria and plants can capture energy from sunlight or chemicals and convert it into forms that living cells can use. These organisms are called autotrophs. Autotrophs use solar or chemical energy to produce food by assembling inorganic compounds into complex organic molecules. But autotrophs do more than feed themselves. Autotrophs store energy in forms that make it available to other organisms that eat them. That's why autotrophs are also called primary producers.","chart":null},{"id":"passage-16","name":"The Risk of Flying","stars":4,"pages":"33–34","text":"(1) There's a lot more to trying to evaluate whether a particular risk is big or small than you might think. Flying in airplanes is a case in point. (2) You'd think that you could determine the numbers and the odds and that would be it. The annual risk of being killed in a plane crash for the average American is about 1 in 11 million. On that basis, the risk looks pretty small. Compare that, for example, to the annual risk of being killed in a motor vehicle crash for the average American, which is about 1 in 5,000. (3) But if you think about those numbers, problems occur right away. Some people fly more and some fly less and some don't fly at all. So if you take the total number of people killed in commercial plane crashes and divide that into the total population, the result, the risk for the average American, may be a good general guide to whether the risk is big or small, but it's not specific to your personal risk. (4) Then there is another numbers problem: you can calculate the risk of flying by dividing the number (1) of people who die into the total number of people, which gives you the risk for the average person; (2) of victims into the number of total flights all passengers took, which gives the risk per flight; and (3) of victims into the total number of miles all of them flew, which gives you the risk per mile. (5) They all produce accurate numbers, but which one is most relevant to you depends on your personal flying patterns. Some fliers take lots of short flights and some take longer ones. Since the overwhelming majority of the few plane crashes that do occur take place in connection with takeoffs and landings, the risk is less a matter of how far you fly and more a matter of how often. If you are a frequent flier, then the risk per flight means more. For occasional long-distance fliers, the risk per mile means more. A frequent, long- distance flier would want to consider both.","chart":null},{"id":"passage-17","name":"Toxic Waste","stars":4,"pages":"35–37","text":"(1) The unwanted poisonous by-products of human activity, toxic wastes can arise from many sources. Atmospheric pollution, for example, is caused by automobiles, power plants, and incinerators. Acid rain is produced when oxides of sulfur, carbon, and nitrogen from burning fossil fuels combine with moisture in the air, producing hazardous acids. Discarded industrial solvents include low-molecular-weight materials such as benzene and carbon tetrachloride and high-molecular-weight organic materials such as PCBs (polychlorinated biphenyls), which were used in the past for hydraulic fluids and in electrical transformers and capacitors. Dioxins are the unwanted by-products of the manufacture of herbicides. Heavy-metal residues from copper or silver mining can contaminate groundwater or streams and lakes and become concentrated in fish. Radioactive wastes are generated by nuclear power reactors, the manufacture of nuclear weapons, and, at low levels, by the industrial and medical application of radioisotopes. (2) In 1981 approximately 264 million tons of waste were produced in the United States—about 5.5 million tons were considered hazardous. During 1986 the United States generated about 1,770,000 cubic feet (50,000 cubic meters) of low-level solid and liquid radioactive waste. (3) Many toxic wastes can harm humans, animals, or plants. Significant exposure to lead in paints and gasoline can lead to nervous disorders. Organic toxic wastes can lead to liver and kidney inflammation. Others, such as PCBs, are suspected of causing birth defects. Some organic materials, such as benzene, are known to cause cancer in laboratory animals and are listed as possible cancer-producing agents in humans. Moderately high levels of copper, silver, and other heavy metals are detrimental to the growth of algae. (4) Some toxic wastes cause ecological imbalances. The insecticide DDT (dichloro-diphenyl- trichloroethane), for example, almost wiped out the American bald eagle population and reduced many other bird populations. It destroyed the birds' ability to develop a sufficiently strong egg shell to assure hatching. Because of DDT's threat to bird populations, severe restrictions were imposed in 1972 on its use in the United States. Other laws required the reduction of lead in gasoline and the termination of PCB production. DDT is still used in developing countries for its effectiveness against the malaria-carrying mosquito. (5) Depending on the type of waste, toxic wastes can be treated chemically, biologically, or by combustion. An acid spill, for example, may be treated with lime or bicarbonate to neutralize the acid. Oil spills at sea are often treated with an emulsifier to disperse the oil in the water, thereby reducing the adverse effects on beaches and on wildlife. Effective methods of biological treatment of toxic wastes are still undergoing development. Organisms that can survive the toxicity and degrade the toxic wastes in a reasonable amount of time have not been found, but advances in genetic engineering may change this situation.\n\n(6) Combustion and other high-temperature treatments are the major methods used to reduce the toxicity of wastes. Processes involving plasma technology are used for specific toxic wastes. These processes use high temperatures to ionize a mixture of air and fuel gases. When combined with these ionized gases, hot toxic gases from the waste are decomposed into relatively harmless components. Plasma treatment at temperatures above 1,650 °F (900 °C) can diminish the toxicity of gas emissions such as dioxin vapor by about ten times the reduction that results from conventional combustion treatments. (7) Incineration of liquid wastes is the primary method of toxic waste treatment in the United States. It usually involves injecting the waste as small droplets into a burner. A fixed-hearth process, by which both liquid and solid wastes can be handled, is also used. The waste is treated in two stages. It is first partially burned with insufficient air and then burned again with excess air at higher temperatures to destroy the gases released during the first stage. (8) Another widely used process involves incineration in a rotary kiln. This is used for solids, liquids, their mixtures (slurries), and wastes in containers. Some hazardous wastes are disposed of directly as fuel in industrial boilers or cement kilns. (9) Liquid toxic wastes must be stored temporarily before disposal. Steel drums are used for short-term storage. Materials less subject to corrosion, such as glass or ceramic, are often required for long-term storage. Ocean dumping and the use of landfills are no longer permitted for the disposal of hazardous waste in the United States.","chart":null},{"id":"passage-18","name":"New Plants","stars":4,"pages":"38","text":"(1) The discovery and introduction of new crop plants has frequently changed human history. Before they were discovered in the Americas, many important crops—including corn, peanuts, and potatoes—were unknown in Europe. The introduction of these plants changed European agriculture rapidly. We think of boiled potatoes, for example, as a traditional staple of German and Irish cooking, but 400 years ago, potatoes were new items in the diets of Europeans. (2) The efficiency of agriculture has been improved through the selective breeding of crop plants and improvements in farming techniques. The corn grown by Native Americans, for example, was developed more than 8,000 years ago from teosinte, a wild grass found in Mexico. Further selective breeding has produced modern-day corn. The change caused by selective breeding can be very dramatic. (3) In more recent times, other familiar crops have been the product of selective breeding. Sugar beets, the source of most refined sugar in the United States, were produced from the ordinary garden beet using selective breeding. Plants as different as cabbage, broccoli and brussels sprouts have been developed from a single species of wild mustard.","chart":null},{"id":"passage-19","name":"Introducing Psychology","stars":4,"pages":"39–40","text":"(1) Psychology is the scientific study of mind and behavior. The word \"psychology\" comes from the Greek words \"psyche,\" meaning life, and \"logos,\" meaning explanation. Psychology is a popular major for students, a popular topic in the public media, and a part of our everyday lives. Television shows often feature psychologists who provide personal advice to those with personal or family difficulties. Crime dramas such as CSI, Lie to Me, and others feature the work of forensic psychologists who use psychological principles to help solve crimes. And many people have direct knowledge about psychology because they have visited psychologists, for instance, school counselors, family therapists, and religious, marriage, or bereavement counselors. (2) Because we are frequently exposed to the work of psychologists in our everyday lives, we all have an idea about what psychology is and what psychologists do. In many ways, your conceptions are probably correct. Psychologists do work in forensic fields, and they do provide counseling and therapy for people in distress. But there are hundreds of thousands of psychologists in the world, and most of them work in other places, doing work that you are probably not aware of. (3) Most psychologists work in research laboratories, hospitals, and other field settings where they study the behavior of humans and animals. For instance, experts in the Psychology Department at the University of Maryland study such diverse topics as anxiety in children, the interpretation of dreams, the effects of caffeine on thinking, how birds recognize each other, and how people from different cultures react differently in negotiation. Psychologists also work in schools and businesses, and they use a variety of methods, including observation, questionnaires, interviews, and laboratory studies, to help them understand behavior.","chart":null},{"id":"passage-20","name":"Pricing Strategies","stars":4,"pages":"41–42","text":"Passage A: Customer Value-Based Pricing (1) The price a company charges will fall somewhere between one that is too high to produce any demand and one that is too low to produce any profit. (2) In the end, the customer will decide whether a product's price is right. Pricing decisions, like other marketing mix decisions, must start with customer value. When customers buy a product, they exchange something of value (the price) to get something of value (the benefits of having or using the product). Effective, customer-oriented pricing involves understanding how much value consumers place on the benefits they receive from the product and setting a price that captures this value. (3) Customer value-based pricing uses buyers' perceptions of value, not the seller's cost, as the key to pricing. Value-based pricing means that the marketer cannot design a product and marketing program and then set the price. Price is considered along with the other marketing mix variables before the marketing program is set. (4) Although costs are an important consideration in setting prices, cost-based pricing is often product driven. The company designs what it considers to be a good product, adds up the cost of making the product, and sets a price that covers costs plus a target profit. Marketing must then convince buyers that the product's value at that price justifies its purchase. If the price turns out to be too high, the company must settle for lower markups or lower sales, both resulting in disappointing profits. Passage B: Good-Value Pricing (1) Recent economic events have caused a fundamental shift in consumer attitudes towards price and quality. In response, many companies have changed their pricing approaches to bring them into line with changing economic conditions and consumer price perceptions. More and more, marketers have adopted (2) In many cases, this has involved introducing less-expensive versions of established, brand-name products. To meet the tougher economic times and more frugal consumer spending habits, fast-food restaurants such as Taco Bell and McDonald's offer value meals and dollar menu items. Armani offers the less-expensive, more casual Armani Exchange fashion line. Alberto-Culver's TRESemmé hair care line promises 'A salon look and feel at a fraction of the price.' And every car company now offers small, inexpensive models better suited to the strapped consumer's budget.","chart":null},{"id":"passage-21","name":"Non-Western Economic Thought","stars":4,"pages":"43–44","text":"(1) Western historians of economic thought, like ourselves, have a tendency to focus on Western writers. Whether this is justified or not is a matter of opinion. J. A. Schumpeter, who wrote a comprehensive, widely respected history of economic thought in 1954, held that he could find no non-Western early economic writing with any analytic content, and further that no piece of reasoning on strictly economic topics has come down to us that can be called \"scientific\" within our meaning of the term. Schumpeter also pointed to what he regarded as a curious gap in economic literature between the writings of the Greeks and Aquinas, a period of nearly one thousand years during which no economic writings of merit seemed to have been produced. (2) Scholars since Schumpeter have questioned his conclusions and have been able to find some interesting early economic writings of merit. We will briefly examine newly translated works of a seventh century BCE Chinese writer, Guan Zhong (725–645 BC), in order to give you a flavor of his contributions and, more broadly, to suggest that analysis of economic activity is likely to occur at various times and places. The majority of early Chinese writings on economics fit Schumpeter's characterization: they were essentially limited to considerations of public administration within ethical frameworks, rather than strictly \"scientific\" studies. Guan Zhong's book Guanzi, however, stands out as going far beyond the administrative mold. It includes a number of ideas that are central to economic thinking. Probably the most important of these is his \"light/heavy\" theory, an anticipation of supply/demand theory. Others include his anticipation of the quantity theory, his discussion of countercyclical fiscal policy, and his appreciation for the workings of the market. (3) Guan Zhong argued that when a good was abundant it became light and its price would fall. When it was locked away it became heavy, and its price would rise. There would be movements of goods into and out of markets based on their lightness and heaviness, with a definite tendency toward one price—","chart":null}];function safe(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function render(){const q=document.getElementById('search').value.toLowerCase();const arr=D.filter(x=>x.name.toLowerCase().includes(q));document.getElementById('count').textContent='المعروض '+arr.length+' من '+D.length+' قطعة';document.getElementById('list').innerHTML=arr.map(x=>'<details class="card"><summary><span class="row"><b>'+safe(x.name)+'</b><span class="star">★'+x.stars+'</span></span><span class="muted">صفحات '+x.pages+' • اضغط لقراءة النص</span></summary>'+(x.chart?'<p>'+safe(x.chart)+'</p>':'')+(x.text?'<div class="passage">'+safe(x.text)+'</div>':'')+'<p class="muted">هذه مادة من تجميعات غير رسمية؛ ترتيب النجوم كما أورده الملف المرفق، وليس ضمانًا لتكرار السؤال. راجع مواضع النص الأصلي في ملف PDF عند الحاجة.</p><a class="btn" href="./academy.html">تدريب مرتبط بالقراءة</a></details>').join('')}render();</script></html>
