{id:'energy',title:'Energy Producers and Consumers',ar:'منتجو الطاقة ومستهلكوها',page:'3–4',passage:`At the core of every organism’s interaction with the environment is its need for energy to power life processes. Ants use energy to carry objects many times their size. Birds use energy to migrate thousands of miles.\n\nLiving systems operate by expending energy. Organisms need energy for growth, reproduction, and their own metabolic processes. For most life on earth, sunlight is the ultimate energy source. For some organisms, chemical energy stored in inorganic compounds serves as the ultimate energy source.\n\nOnly algae, certain bacteria and plants can capture energy from sunlight or chemicals and convert it into forms that living cells can use. These organisms are called autotrophs. Autotrophs store energy in forms that make it available to other organisms that eat them. That’s why autotrophs are also called primary producers.`,qs:[['Why are autotrophs known as primary producers?',['Because the word means primary producers in Latin.','They survive without energy.','They only use chemicals.','Because their production of energy benefits other organisms.'],3,'النص يوضح أن الكائنات ذاتية التغذية تخزن طاقة يمكن للكائنات الأخرى الاستفادة منها.'],['The word “transferred” is closest in meaning to…',['driven','moved','made','saved'],1,'Transferred تعني منقول أو انتقل، وأقرب كلمة هي moved.'],['The word “discovered” is closest in meaning to…',['believed','found','hoped','tried'],1,'Discovered = found أي اكتشف أو وجد.']]},
{id:'psych',title:'Introducing Psychology',ar:'مقدمة في علم النفس',page:'4–5',passage:`Psychology is the scientific study of mind and behavior. The word “psychology” comes from the Greek words “psyche,” meaning life, and “logos,” meaning explanation. Psychology is a popular major for students and a part of our everyday lives.\n\nPsychologists do work in forensic fields, and they do provide counseling and therapy for people in distress. But there are hundreds of thousands of psychologists in the world, and most of them work in other places.\n\nMost psychologists work in research laboratories, hospitals, and other field settings where they study the behavior of humans and animals. Psychologists also work in schools and businesses, and they use observation, questionnaires, interviews, and laboratory studies to understand behavior.`,qs:[['What do psychologists do to help people who are unhappy in their lives?',['They advise them to stop drinking coffee.','They provide them with treatment services.','They take them to special hospitals.','They advise them about food.'],1,'ورد في النص أن الأخصائيين يقدمون counseling and therapy أي الإرشاد والعلاج.'],['What does the passage say about the work of most psychologists?',['It is field research.','It is forensic science.','It is TV entertainment.','It is personal counseling.'],0,'يشير النص إلى المختبرات والمستشفيات والعمل البحثي الميداني.'],['Which word can replace “But” in paragraph 2?',['In addition','Therefore','Finally','However'],3,'But وHowever تستخدمان للمقابلة أو الاستدراك.'],['What does the writer think about our knowledge of psychology?',['It is complete.','It is incorrect.','It comes only from university.','It comes from experience.'],3,'يذكر الكاتب معرفتنا بعلم النفس من حياتنا اليومية وتجاربنا.']]},
{id:'plants',title:'New Plants',ar:'النباتات الجديدة',page:'10',passage:`The discovery and introduction of new crop plants has frequently changed human history. Before they were discovered in the Americas, many important crops—including corn, peanuts, and potatoes—were unknown in Europe. The introduction of these plants changed European agriculture rapidly.\n\nThe efficiency of agriculture has been improved through the selective breeding of crop plants and improvements in farming techniques. The corn grown by Native Americans was developed more than 8,000 years ago from teosinte, a wild grass found in Mexico.\n\nIn more recent times, familiar crops have been the product of selective breeding. Plants as different as cabbage, broccoli, and brussels sprouts have been developed from a single species of wild mustard.`,qs:[['The word “species” is closest in meaning to…',['variety','ingredient','experiment','design'],0,'Species تعني نوعًا، وأقرب الخيارات variety.'],['The word “agriculture” is closest in meaning to…',['industry','culture','farming','diet'],2,'Agriculture = farming أي الزراعة.']]},
{id:'flight',title:'Flying and Risk',ar:'مخاطر السفر بالطائرة',page:'10–11',passage:`There’s a lot more to trying to evaluate whether a particular risk is big or small than you might think. Flying in airplanes is a case in point.\n\nThe annual risk of being killed in a plane crash for the average American is about 1 in 11 million. Compare that with the risk of being killed in a motor vehicle crash, about 1 in 5,000. However, some people fly more and some fly less, and some don’t fly at all.\n\nThe overwhelming majority of the few plane crashes that do occur take place in connection with takeoffs and landings. The risk is less a matter of how far you fly and more a matter of how often.`,qs:[['Which two words mean “find out”?',['think / divide','take / compare','produce / consider','determine / calculate'],3,'Determine وcalculate تأتيان بمعنى التحديد والحساب للوصول إلى نتيجة.'],['How does the writer’s view differ from the general belief?',['It is always 1 in 11 million.','It depends only on national averages.','It depends on individual flying habits.','It depends on the plane’s condition.'],2,'الخطر الشخصي يتأثر بعدد الرحلات وأنماط السفر.'],['When do most plane crashes occur according to the passage?',['During takeoff and landing','During takeoff and mid-flight','During mid-flight and landing','Only on long-distance flights'],0,'النص ينص على takeoffs and landings.']]},
{id:'conservation',title:'Preserving Habitats and Ecosystems',ar:'حماية المواطن البيئية',page:'13–14',passage:`The main thrust of global conservation efforts today is to protect not just individual species but entire ecosystems. The goal is to preserve the natural interactions of many species. Governments and conservation groups work to set aside land as parks and reserves.\n\nThe challenge is protecting areas that are large enough and contain the right resources to protect biodiversity. Conservation biologists have identified ecological “hotspots.” An ecological hotspot is a place where significant numbers of species and habitats are in immediate danger of extinction.`,qs:[['The word “thrust” is closest in meaning to…',['intention','judgment','guarantee','circumstance'],0,'المقصود من thrust هنا الهدف أو الاتجاه الرئيسي، أي intention.'],['The word “concentrated” is closest in meaning to…',['balanced','identified','appreciated','emphasized'],3,'بمعنى تركيز الجهود وتوجيه الانتباه نحو الأماكن الأهم.']]},
{id:'strawberry',title:'California Strawberries',ar:'فراولة كاليفورنيا',page:'8–9',passage:`California’s strawberry industry is the state’s sixth most important commodity in terms of the value of crops sold. The industry’s growth has relied on heavy use of toxic chemicals.\n\nGrowers hire pest control companies to fumigate soils before planting strawberries in order to kill soil-borne pests, most importantly plant pathogens such as Verticillium dahliae and Macrophomina phaseolina. Without such treatment, these pathogens cause strawberry plants to wilt and die.\n\nOrganic strawberry production rose fivefold between 2000 and 2012, to reach about 3,300 acres planted in 2017.`,qs:[['What are two plant pathogens that harm strawberries?',['Verticillium dahliae and Macrophomina phaseolina','Methyl bromide and methyl iodide','Methyl iodide and Macrophomina phaseolina','Verticillium dahliae and methyl bromide'],0,'النص يذكر هذين المسببين المرضيين بالاسم.'],['Between which years did organic strawberry production rise fivefold?',['1960 and 2014','2005 and 2015','2010 and 2012','2000 and 2012'],3,'ذكرت القطعة الفترة 2000–2012 صراحة.']]},
{id:'trade',title:'The World Economic Outlook for Trade',ar:'آفاق التجارة العالمية',page:'2–3',passage:`America’s leading export partner, Canada, showed a growth rate of 2.6 percent in 2010 and 3.6 percent in 2011. America’s second largest export customer, Mexico, suffered another major setback in 2009.\n\nChina’s total share in world trade expanded from 1 percent in 1980 to almost 6 percent in 2003. By 2004, China had become the third largest trading nation in dollar terms, behind the United States and Germany.\n\nAmong the nations that have enjoyed several years of positive economic growth are the member countries of the Central European Free Trade Association: Hungary, the Czech Republic, Poland, Slovenia and Slovakia.`,qs:[['Who is America’s leading export partner?',['USA','Canada','Mexico','United Kingdom'],1,'تذكر القطعة أن كندا هي الشريك الأول للصادرات الأمريكية.'],['What was China’s total world trade share in 2003?',['1 percent','4.5 percent','Almost 6 percent','9.5 percent'],2,'ارتفعت حصة الصين إلى ما يقارب 6% في 2003.'],['Which country is a member of the Central European Free Trade Association?',['Armenia','Poland','Moldova','Turkey'],1,'بولندا مذكورة ضمن الدول الأعضاء في النص.']]},
{id:'tax',title:'Consumption Taxes',ar:'ضرائب الاستهلاك',page:'12–13',passage:`Three important consumption taxes are the sales tax, the excise tax, and the value added tax (VAT).\n\nAn excise tax is a sales tax that applies only to certain classes of goods, such as luxury items. Excise taxes on high-demand non-necessities, such as cellular telephones, raise much more revenue. Some states impose excise taxes on “sin” purchases, such as cigarettes.\n\nSocial Security taxes and Medicare taxes are wage taxes.`,qs:[['According to the passage, what are kinds of wage taxes?',['Income tax and sales tax','Social Security and Medicare taxes','Purchase and Medicare taxes','Payroll and wealth taxes'],1,'القطعة تسمي ضرائب الضمان الاجتماعي وميديكير ضمن ضرائب الأجور.'],['Which are examples of excise-taxed items?',['Cigarettes and property','Property and wages','Cigarettes and wages','Cellphones and cigarettes'],3,'ذُكر الهاتف المحمول والسجائر كمثالين.']]}
];

{id:'conditionals',title:'الجمل الشرطية',emoji:'🌦️',level:'متوسط',body:'الشرط الأول لحالة محتملة مستقبلًا: If + present, will + verb. والشرط الثاني لحالة افتراضية: If + past, would + verb.',examples:['If it rains, we will stay home.','If I had time, I would travel.'],qs:[['If it rains, we ___ home.',['stay','stayed','will stay','staying'],2,'الشرط الأول: will + المصدر في الجملة الرئيسية.'],['If I were rich, I ___ a house.',['buy','will buy','would buy','bought'],2,'حالة افتراضية: would buy.'],['If she studies, she ___ pass.',['will','would','did','has'],0,'الشرط الأول يستخدم will.']]},
{id:'relative',title:'ضمائر الوصل',emoji:'🔗',level:'متوسط',body:'Who للأشخاص، Which للأشياء والحيوانات، Where للأماكن، وWhose للملكية. يمكن استخدام That في جمل وصل محددة للأشخاص أو الأشياء.',examples:['The teacher who helped me is kind.','The book which I bought is new.','This is the city where I grew up.'],qs:[['The man ___ called is my teacher.',['which','who','where','whose'],1,'Who تعود على شخص.'],['This is the place ___ we met.',['who','which','where','whose'],2,'Where للمكان.'],['The girl ___ bag was lost is here.',['who','which','whose','where'],2,'Whose تدل على الملكية.']]},

{id:'library',title:'Digital Libraries',ar:'المكتبات الرقمية — تدريب أصلي',page:'تدريب من إعداد التطبيق',passage:`Digital libraries have changed how students search for information. Instead of visiting a building, users can access articles, books, and research reports from their phones or computers. Many resources are available at any time. However, not everything found online is reliable. Students should examine the author, date, and evidence before citing a source. Libraries also help learners by teaching research skills and providing access to carefully selected materials.`,qs:[['What is one advantage of digital libraries?',['They are always free','They can be accessed remotely','They replace all teachers','They contain only new books'],1,'النص يذكر الوصول من الهاتف أو الكمبيوتر دون زيارة المبنى.'],['The word “reliable” is closest in meaning to:',['Trustworthy','Expensive','Popular','Simple'],0,'reliable تعني موثوقًا.'],['What does the writer recommend?',['Avoiding all online articles','Checking the author and evidence','Using only printed books','Ignoring publication dates'],1,'ينصح النص بالتحقق من الكاتب والتاريخ والأدلة.'],['What is the main idea?',['The cost of computers','Digital libraries and responsible research','Why paper books disappeared','The history of universities'],1,'الفكرة هي فوائد المكتبات الرقمية وأهمية التحقق من المصادر.']]},
{id:'urban',title:'Urban Green Spaces',ar:'المساحات الخضراء — تدريب أصلي',page:'تدريب من إعداد التطبيق',passage:`Public parks provide more than attractive views. Trees can reduce summer temperatures by offering shade, while open spaces give residents places to exercise and meet neighbors. Some studies have also linked access to green areas with improved well-being. Yet creating parks in crowded cities can be difficult because land is expensive. City planners must balance housing, transportation, and recreation needs when deciding how land should be used.`,qs:[['What can trees do during summer?',['Increase traffic','Provide shade','Raise land prices','Stop all pollution'],1,'الأشجار توفر الظل وتساعد على تقليل الحرارة.'],['Why can building parks be difficult?',['They are unpopular','Land may be expensive','People dislike exercise','Trees cannot grow in cities'],1,'النص يذكر تكلفة الأرض في المدن المزدحمة.'],['The word “balance” is closest in meaning to:',['Ignore','Compare fairly','Remove','Delay'],1,'balance هنا تعني الموازنة بين احتياجات مختلفة.'],['Which is the best title?',['Benefits and Challenges of City Parks','The History of Transportation','How to Buy Houses','Sports in Schools'],0,'العنوان يلخص الفوائد والتحديات.']]},
{id:'sleep',title:'Sleep and Learning',ar:'النوم والتعلم — تدريب أصلي',page:'تدريب من إعداد التطبيق',passage:`Sleep plays an important role in learning. During sleep, the brain processes information acquired during the day. Students who stay awake all night to prepare for an examination may remember less than they expect. Short study sessions spread over several days, together with sufficient sleep, are generally more useful than a single long session. Researchers also recommend a consistent bedtime because regular habits make it easier to fall asleep.`,qs:[['What happens during sleep?',['The brain processes information','All memories disappear','Students become less focused permanently','The body stops working'],0,'أثناء النوم يعالج الدماغ المعلومات المكتسبة.'],['What may happen after studying all night?',['Students always score higher','Students may remember less','They never feel tired','They learn without effort'],1,'يذكر النص احتمال تذكر معلومات أقل.'],['The word “sufficient” is closest in meaning to:',['Enough','Extraordinary','Brief','Unusual'],0,'sufficient تعني كافيًا.'],['Which method is recommended?',['One long session only','Studying in short sessions over days','Never reviewing notes','Sleeping at different times each night'],1,'النص يوصي بجلسات قصيرة موزعة مع نوم كافٍ.']]}
);

{id:'coral',title:'Coral Reefs Under Pressure',ar:'الشعاب المرجانية — استنتاج وفكرة رئيسية',passage:`Coral reefs occupy less than one percent of the ocean floor, yet they provide shelter for a remarkable variety of marine species. This apparent contradiction is explained partly by their complex structure, which creates numerous habitats in a relatively small area. Reefs also support nearby communities through fisheries and tourism.\n\nHowever, the benefits reefs provide should not be confused with resilience. When ocean temperatures rise for prolonged periods, corals may expel the microscopic algae that supply much of their food. The resulting bleaching does not always kill coral immediately, but it leaves colonies vulnerable to disease and starvation. Recovery is possible if conditions improve quickly; repeated heat waves, though, leave little time for damaged reefs to rebuild.\n\nSome communities are restoring reefs by transplanting nursery-grown corals. Although such projects can help particular sites, researchers caution that transplantation alone cannot counter continued warming. Protecting reefs therefore requires both local measures, such as reducing pollution, and wider action on climate change.`,qs:[

{id:'memory',title:'How Memory Changes',ar:'الذاكرة والتعلم — تحليل العلاقات',passage:`People often imagine memory as a recording that can be replayed exactly. Cognitive research, however, suggests that remembering is reconstructive: the brain combines stored details with existing knowledge and expectations. As a result, two witnesses to the same event may sincerely report different details. This does not necessarily imply dishonesty.\n\nRetrieval practice—trying to recall an idea without looking at notes—can strengthen long-term learning. In one approach, students read a short explanation, put it aside, and write down what they remember. They then consult the source to identify gaps. Repeating this process after increasing intervals is usually more effective than rereading the same page continuously, even though rereading may feel easier.\n\nThese findings have implications beyond classrooms. Interviewers should avoid leading questions that might shape a witness's account. Likewise, learners should judge their progress through successful recall rather than through the familiarity that comes from seeing information many times.`,qs:[
['Which sentence best expresses the central idea?',['Memory functions like a perfect video recording','Both recall and testimony are influenced by how memory operates','Every witness deliberately changes details','Rereading is always harmful'],1,'النص يربط طبيعة الذاكرة بنتائجها على الشهادة والتعلم.'],
['The word “reconstructive” most nearly means:',['Built again from pieces','Stored without change','Produced by machines','Impossible to measure'],0,'الشرح اللاحق: يجمع الدماغ تفاصيل سابقة مع المعرفة والتوقعات.'],
['Why might rereading appear effective?',['It guarantees long-term retention','It increases familiarity with the material','It prevents memory from changing','It forces students to retrieve without notes'],1,'even though rereading may feel easier؛ السطر الأخير يذكر familiarity.'],
['Which practice most directly tests retrieval?',['Highlighting the passage while reading','Writing remembered points with the book closed','Copying a paragraph word for word','Reading the same sentence five times'],1,'retrieval = الاسترجاع من دون النظر للمصدر.'],
['What can reasonably be inferred about leading questions?',['They may influence details recalled by a witness','They are required for accurate testimony','They prevent all misunderstandings','They change the original event'],0,'الفقرة الأخيرة تحذر من الأسئلة الموجهة لأنها قد تشكل الرواية.'],
['The phrase “identify gaps” means to:',['Remove blank pages','Notice missing knowledge','Avoid difficult subjects','Find larger classrooms'],1,'بعد الاسترجاع يراجع المصدر لمعرفة ما لم يتذكره.']]},
{id:'water',title:'Cities and Water Demand',ar:'المدن والمياه — تفاصيل واستنتاج',passage:`Cities typically expand their water systems when populations grow, but adding supply is not always the cheapest response. Water can be lost through aging pipes before reaching consumers, and repairing major leaks may save substantial amounts. Some cities also encourage households to install efficient fixtures or replace plants that require frequent watering.\n\nA difficulty is that water demand varies. During a hot, dry summer, outdoor use may rise sharply, even when indoor consumption stays relatively steady. Planners therefore distinguish average demand from peak demand. If infrastructure is designed only for the average, it may struggle during brief periods of heavy use.\n\nPricing can influence consumption, but its design matters. A uniform increase may burden low-income households while doing little to deter customers who can afford high bills. Tiered pricing, under which the unit price rises after basic use, aims to preserve access to essential water and discourage excessive consumption. Yet no pricing method can substitute for maintaining pipes and preparing for drought.`,qs:[
['Which is an example of managing demand rather than increasing supply?',['Constructing a new reservoir','Encouraging efficient household fixtures','Importing water from another region','Digging a deeper municipal well'],1,'الأجهزة الموفرة تخفض الاستهلاك بدل زيادة مصادر المياه.'],
['Why is peak demand important in planning?',['It represents the cheapest monthly bill','It predicts average household income','Systems may fail during short periods of unusually high use','It is always lower than average demand'],2,'الفقرة الثانية تقول قد تعاني البنية إذا صممت للمتوسط وحده.'],
['What is implied about a uniform price increase?',['It affects all households equally in practice','It may have unequal effects on different income groups','It always reduces water use to zero','It removes the need for pipeline repairs'],1,'النص يقول قد يثقل الأسر الأقل دخلًا ولا يردع القادرين على الدفع.'],
['The word “deter” is closest in meaning to:',['Discourage','Measure','Guarantee','Replace'],0,'deter = يثني أو يردع.'],

</p></div><button class="btn alt" onclick="openItem('reading','${p.id}')">افتح</button></div>`).join('')}</div>`+(items.length?'':'<div class="empty">لا توجد نتائج للبحث.</div>')}function renderQuestionsOnly(){let el=$('qs');if(!el)return;let qs=getQuestions(),n=Object.keys(answers).length,score=qs.reduce((a,q,i)=>a+(answers[i]===q.correct?1:0),0);let html='';if(!qs.length){el.innerHTML='<div class="empty">✅ انتهت الأسئلة الجديدة في هذا القسم. لن نعيد سؤالًا شاهدته سابقًا. جرّب قسمًا آخر أو صفّر سجل الأسئلة من صفحة الاختبارات.</div>';return}if(submitted)html+=`<div class="result"><div>نتيجتك</div><div class="score">${Math.round(score/qs.length*100)}%</div><h3>${score} من ${qs.length} إجابة صحيحة</h3><p class="muted">${score===qs.length?'ممتاز! إجاباتك كلها صحيحة 🎉':'راجع التوضيحات أسفل الأسئلة، ثم جرّب أسئلة جديدة.'}</p><button class="btn" onclick="${mode==='placement'?`go('home')`:mode==='test'?`startTest('${current}')`:mode==='listening'?`go('listening')`:`go('${page}')`}">${mode==='placement'?'انتقل للرئيسية':mode==='listening'?'تمارين الاستماع':'أسئلة جديدة'}</button></div>`;qs.forEach((q,i)=>{html+=`<div class="question"><div class="meta">السؤال ${i+1} من ${qs.length}</div>${q.passage?`<details class="meta"><summary style="cursor:pointer;padding:8px 0">📖 اعرض القطعة المرجعية: ${esc(q.passage.title)}</summary><div class="passage">${esc(q.passage.passage)}</div></details>`:''}<h3>${esc(q.question)}</h3>${q.options.map((opt,j)=>`<button class="choice ${answers[i]===j?'selected':''} ${submitted&&j===q.correct?'correct':''} ${submitted&&answers[i]===j&&j!==q.correct?'wrong':''}" onclick="choose(${i},${j})">${String.fromCharCode(65+j)}. ${esc(opt)}</button>`).join('')}${submitted?`<div class="explain"><strong>${answers[i]===q.correct?'✓ إجابة صحيحة':'✕ الإجابة الصحيحة: '+String.fromCharCode(65+q.correct)}</strong><div>${esc(q.explain)}</div></div>`:''}</div>`});if(!submitted)html+=`<div class="quizsticky"><div><div class="small">أجبت عن ${n} من ${qs.length}</div><div class="progress" style="width:135px;margin-top:8px"><span style="width:${n/qs.length*100}%"></span></div></div><button class="btn dark" ${n<qs.length?'disabled':''} onclick="submit()">إنهاء وتصحيح الاختبار</button></div>`;el.innerHTML=html}function tick(){let el=$('timer');if(!el||page!=='tests'||mode!=='test'||submitted)return;let sec=Math.floor((Date.now()-startedAt)/1000);if(current==='mock'){let left=Math.max(0,2700-sec);el.textContent='الوقت المتبقي: '+String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');if(left===0){submit();return}}else el.textContent='الوقت المنقضي: '+String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');setTimeout(tick,1000)}let installPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;if(page==='install')render()});if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}if(!placementResult)beginPlacement();else render();
</script><a href="./weekly.html" style="position:fixed;bottom:18px;left:18px;z-index:99999;background:#0d9488;color:white;padding:14px 18px;border-radius:20px;box-shadow:0 8px 28px #004d4850;text-decoration:none;font:700 15px Tahoma,Arial;direction:rtl">🔥 تجميعات الأسبوع الجديدة</a></body></html>
